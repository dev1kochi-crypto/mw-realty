    custom: []
    httpMethods:
      - GET
    uri: api/crm/market-demand
    metadata:
      custom: []
      groupName: 'Market demand'
      groupDescription: |-
        **Feature 7 — property demand and market analytics.** Anonymised, aggregated marketplace demand (searches, views, saves, enquiries vs listing supply) — never an individual lead or visitor. On the website it is the **Buyer demand** section of Property Details; in the CRM it is the **Market Demand** page for agencies and developers (where buyers look, underserved bedroom counts and price bands, month-by-month change), a plan feature (`market_demand`).

        **Also uses (connected):**

        * `GET /api/properties/{slug}/demand` — see **Property Details — new sections**
        * `GET /api/properties/{slug}/demand/summary` — see **Property Details — new sections**
      subgroup: 'CRM Market Demand'
      subgroupDescription: ''
      title: 'Market demand'
      description: |-
        The report for one area (empty = all of MW Realty) and purpose, optionally one property type:
        interest totals and changes (last 30 days vs the 30 before), demand level against the city /
        platform, interest vs listings by bedrooms and price band, monthly trend, most wanted
        amenities and key findings. Counts below `fewer_than` are null.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      X-Device-Id: '{DEVICE_ID}'
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      area:
        custom: []

      groupName: 'Cross-border compare'
      groupDescription: |-
        **Feature 4 — cross-border property intelligence.** Compare 2–5 listings in any UAE emirate side by side in one shape: price, size, price per sq.ft, buying costs under each emirate's fees (move-in costs for rentals), market estimates, ownership rules, Golden Visa — with a written AI summary in the buyer's currency.

        The money and investment figures are **locked** until the visitor leaves contact details: `POST /api/contact` with `source=compare` returns a token; send it as `X-Compare-Unlock` on both compare endpoints. Amounts in `GET /api/compare` are AED — convert with `GET /api/currencies`; the summary takes `currency` itself.
      subgroup: Compare
      subgroupDescription: ''
      title: 'Compare properties'
      description: |-
        Two to five listings side by side in one shape, whichever emirate they are in: price (rent per
        year), size and price per sq.ft, specs, amenities, nearest place of each type, buying costs
        under that emirate's fees (move-in costs for rentals), market estimates (rent, gross / net
        yield, price vs area, growth), ownership rules and Golden Visa eligibility. `notes` carries the
        cross-border notes (FX margin, UAE tax, notes per buyer currency). Amounts in AED.

        The money & investment figures (`costs`, `total_outlay`, `market`) come back null with
        `locked: true` until the visitor has left their contact details — send the token from
        `POST /api/contact` (source=compare) as the `X-Compare-Unlock` header.
      authenticated: false
      deprecated: false

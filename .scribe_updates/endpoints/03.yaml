        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      mode:
        custom: []
        name: mode
        description: 'write | improve.'
        required: false
        example: write
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      tone:
        custom: []
        name: tone
        description: 'professional | luxury | friendly | concise.'
        required: false
        example: professional
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      specs:
        custom: []
        name: specs
        description: "The form's values (listing_type, property_type, bedrooms, sqft, price, amenities, community, notes…)."
        required: true
        example: []

        description: 'Must not be greater than 2000 characters.'
        required: false
        example: g
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      draft:
        custom: []
        name: draft
        description: 'The current description (HTML), for `improve`.'
        required: false
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanBodyParameters:

        CRM endpoints: `Authorization: Bearer {token}` from `POST /api/crm/auth/login`.
      subgroup: 'Listing form helpers'
      subgroupDescription: ''
      title: Auto-translate
      description: |-
        The source-language title / key features / description / location translated into the other
        site languages (Google Cloud Translation — see AutoTranslator). 503 when not set up.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      X-Device-Id: '{DEVICE_ID}'
    urlParameters: []

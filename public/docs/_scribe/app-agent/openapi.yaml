openapi: 3.0.3
info:
  title: 'MW Realty — Agent App API'
  description: 'The CRM endpoints the MW Realty agent app calls, by app tab: Entry, Home, Leads, Add listing, Listings, More.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: Entry
    description: 'Sign-in (with the email code / two-factor steps when the account needs them), then onboarding and verification: the agent completes the profile, uploads the documents and submits it for approval. `GET /api/crm/auth/me` says what is still missing. Until the account is approved, the Leads and Listings endpoints answer `403`.'
  -
    name: Home
    description: "New leads, leads awaiting a first response, listings needing action — from the dashboard. **Today's follow-ups** have no endpoint yet (see the introduction).\n\n**Also uses (connected):**\n\n* `GET /api/crm/leads` — see **Leads**\n* `GET /api/crm/properties` — see **Listings**\n* `GET /api/crm/notifications` — see **More**"
  -
    name: Leads
    description: 'The inbox (enquiries and viewings from the website, the app, Facebook and Property Finder) and one lead: contact details, stage, tags, notes and — for agency managers — assigning it to an agent.'
  -
    name: 'Add listing'
    description: 'Permit, location, details, media, preview. Drafts are kept on the phone until the agent submits, then sent in one `POST /api/crm/properties` (multipart, photos included).'
  -
    name: Listings
    description: "My listings by state (active, inactive, permit review), quick sold / rented, edit, photos and the sold / rented proof documents.\n\n**Also uses (connected):**\n\n* `POST /api/crm/properties/permit/validate` — see **Add listing**\n* `GET /api/crm/properties/nearby-places` — see **Add listing**\n* `GET /api/crm/properties/agent-options` — see **Add listing**"
  -
    name: More
    description: "Team view for agency managers, notifications, profile and support.\n\n**Also uses (connected):**\n\n* `GET /api/crm/profile` — see **Entry**\n* `POST /api/crm/profile` — see **Entry**\n* `POST /api/crm/profile/avatar` — see **Entry**\n* `POST /api/crm/auth/logout` — see **Entry**"
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/crm/auth/login</code> and send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/crm/auth/login:
    post:
      summary: 'Sign in'
      operationId: signIn
      description: "Either signs in straight away (`token` in the response), or asks for the next step:\n`challenge: \"email\"` → `POST /api/crm/auth/login/verify-email`,\n`challenge: \"totp\"` → `POST /api/crm/auth/login/two-factor`, passing the `challenge_token`."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Signed in'
                    type: object
                    example:
                      token: 1|abc…
                      token_type: Bearer
                      device_token: 9fK2…
                      user:
                        id: 12
                        type: agent
                        name: 'Sara Ahmed'
                    properties:
                      token:
                        type: string
                        example: 1|abc…
                      token_type:
                        type: string
                        example: Bearer
                      device_token:
                        type: string
                        example: 9fK2…
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 12
                          type:
                            type: string
                            example: agent
                          name:
                            type: string
                            example: 'Sara Ahmed'
                  -
                    description: 'New device'
                    type: object
                    example:
                      challenge: email
                      email: sa••••@example.com
                      challenge_token: Xc3…
                    properties:
                      challenge:
                        type: string
                        example: email
                      email:
                        type: string
                        example: sa••••@example.com
                      challenge_token:
                        type: string
                        example: Xc3…
                  -
                    description: 'Two-factor on'
                    type: object
                    example:
                      challenge: totp
                      challenge_token: Xc3…
                    properties:
                      challenge:
                        type: string
                        example: totp
                      challenge_token:
                        type: string
                        example: Xc3…
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid credentials.'
                properties:
                  message:
                    type: string
                    example: 'Invalid credentials.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: agent@example.com
                password:
                  type: string
                  description: ''
                  example: secret123
                device_name:
                  type: string
                  description: "Shown in the account's signed-in devices."
                  example: "Sara's iPhone"
                  nullable: true
                device_token:
                  type: string
                  description: "The `device_token` from this device's last sign-in."
                  example: 9fK2…
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/crm/auth/login/verify-email:
    post:
      summary: 'Verify new-device code'
      operationId: verifyNewDeviceCode
      description: "The 6-digit code emailed by the sign-in step. Answers like Sign in: a `token`, or\n`challenge: \"totp\"` for the authenticator-app step. `restart: true` = start over with the password."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  challenge: totp
                  challenge_token: Xc3…
                properties:
                  challenge:
                    type: string
                    example: totp
                  challenge_token:
                    type: string
                    example: Xc3…
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid or expired code.'
                properties:
                  message:
                    type: string
                    example: 'Invalid or expired code.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                  description: ''
                  example: Xc3…
                code:
                  type: string
                  description: ''
                  example: '482913'
              required:
                - challenge_token
                - code
      security: []
  /api/crm/auth/login/resend-email:
    post:
      summary: 'Resend new-device code'
      operationId: resendNewDeviceCode
      description: ''
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'A new code has been sent.'
                properties:
                  message:
                    type: string
                    example: 'A new code has been sent.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                  description: ''
                  example: Xc3…
              required:
                - challenge_token
      security: []
  /api/crm/auth/login/two-factor:
    post:
      summary: 'Verify two-factor code'
      operationId: verifyTwoFactorCode
      description: "The authenticator-app code, or one of the account's recovery codes. Returns the `token`."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|abc…
                  token_type: Bearer
                  device_token: 9fK2…
                  user:
                    id: 12
                    type: agent
                    name: 'Sara Ahmed'
                properties:
                  token:
                    type: string
                    example: 1|abc…
                  token_type:
                    type: string
                    example: Bearer
                  device_token:
                    type: string
                    example: 9fK2…
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 12
                      type:
                        type: string
                        example: agent
                      name:
                        type: string
                        example: 'Sara Ahmed'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'That code is not valid. Check your authenticator app and try again.'
                properties:
                  message:
                    type: string
                    example: 'That code is not valid. Check your authenticator app and try again.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                  description: ''
                  example: Xc3…
                code:
                  type: string
                  description: ''
                  example: '123456'
              required:
                - challenge_token
                - code
      security: []
  /api/crm/auth/me:
    get:
      summary: 'Current account'
      operationId: currentAccount
      description: "Who is signed in and what they can open — the app's start-up call. `approved: false`\nmeans KYC is still pending: only profile screens work until Super Admin approves."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 12
                    type: agent
                    name: 'Sara Ahmed'
                    status: approved
                    approved: true
                    is_super_admin: false
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 12
                      type:
                        type: string
                        example: agent
                      name:
                        type: string
                        example: 'Sara Ahmed'
                      status:
                        type: string
                        example: approved
                      approved:
                        type: boolean
                        example: true
                      is_super_admin:
                        type: boolean
                        example: false
      tags:
        - Entry
      security: []
  /api/crm/auth/logout:
    post:
      summary: 'Sign out'
      operationId: signOut
      description: 'Revokes the token used for this request (other devices stay signed in).'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Signed out.'
                properties:
                  message:
                    type: string
                    example: 'Signed out.'
      tags:
        - Entry
      security: []
  /api/crm/account/two-factor:
    get:
      summary: 'Two-factor status'
      operationId: twoFactorStatus
      description: ''
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  enabled: false
                  required: false
                  setup_required: true
                  can_skip: true
                  company_enforced: false
                  recovery_codes_left: 0
                  trusted_devices: []
                properties:
                  enabled:
                    type: boolean
                    example: false
                  required:
                    type: boolean
                    example: false
                  setup_required:
                    type: boolean
                    example: true
                  can_skip:
                    type: boolean
                    example: true
                  company_enforced:
                    type: boolean
                    example: false
                  recovery_codes_left:
                    type: integer
                    example: 0
                  trusted_devices:
                    type: array
                    example: []
      tags:
        - Entry
      security: []
  /api/crm/account/two-factor/setup:
    post:
      summary: 'Start set-up'
      operationId: startSetUp
      description: "A new secret to add to the authenticator app — as a QR code (`qr_svg`), an `otpauth://`\nlink (`uri`, opens the app directly on the same phone) or typed in (`secret`). Moving 2FA\nthat is already on to a new phone needs the account `password`; the old app keeps working\nuntil the new one is confirmed."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  secret: JBSWY3DPEHPK3PXP
                  uri: 'otpauth://totp/MW%20Realty:agent@example.com?secret=…'
                  qr_svg: '<svg…>'
                properties:
                  secret:
                    type: string
                    example: JBSWY3DPEHPK3PXP
                  uri:
                    type: string
                    example: 'otpauth://totp/MW%20Realty:agent@example.com?secret=…'
                  qr_svg:
                    type: string
                    example: '<svg…>'
      tags:
        - Entry
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: 'Only when 2FA is already on.'
                  example: secret123
      security: []
  /api/crm/account/two-factor/confirm:
    post:
      summary: 'Confirm set-up'
      operationId: confirmSetUp
      description: "The first code the authenticator app shows. Switches 2FA on and returns the recovery\ncodes — show them once and ask the user to keep them safe. A company can pass\n`enforce: true` to make 2FA mandatory for every agent right away."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Two-factor authentication is now enabled.'
                  recovery_codes:
                    - A1B2C-D3E4F
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Two-factor authentication is now enabled.'
                  recovery_codes:
                    type: array
                    example:
                      - A1B2C-D3E4F
                    items:
                      type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "That code is not valid. Make sure you scanned the latest QR code and that your phone's time is correct."
                properties:
                  message:
                    type: string
                    example: "That code is not valid. Make sure you scanned the latest QR code and that your phone's time is correct."
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: ''
                  example: '123456'
                enforce:
                  type: boolean
                  description: 'Company only.'
                  example: false
                  nullable: true
              required:
                - code
      security: []
  /api/crm/account/two-factor/skip:
    post:
      summary: 'Skip for now'
      operationId: skipForNow
      description: "After sign-up, when 2FA isn't required by the agency — it can be turned on later."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                properties:
                  success:
                    type: boolean
                    example: true
      tags:
        - Entry
      security: []
  /api/crm/profile:
    get:
      summary: 'The profile page'
      operationId: theProfilePage
      description: "Account summary, KYC progress, every section (fields with values, ready to show / edit),\ndocuments, SEO metadata, what's still missing and the public page preview."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - Entry
      security: []
    post:
      summary: 'Save one section'
      operationId: saveOneSection
      description: "Multipart for `seo` (OG image). Fields per section: see GET /profile. A change to a KYC section\n(compliance, other, licenses, identity) sends a submitted review back to \"changes requested\"."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - Entry
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                section:
                  type: string
                  description: 'public, compliance, contact, other, licenses, about, identity or seo.'
                  example: about
                public_email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: carolyne.luettgen@example.org
                  nullable: true
                secondary_phone:
                  type: string
                  description: 'Must match the regex /^\+?[0-9 ()\-]{6,30}$/. Must not be greater than 30 characters.'
                  example: fuudtdsufvyvddqamniih
                  nullable: true
                whatsapp_number:
                  type: string
                  description: 'Must match the regex /^\+?[0-9 ()\-]{6,30}$/. Must not be greater than 30 characters.'
                  example: fqcoynlazghdtqtqxbajw
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: bpilpmufinllwloauydls
                  nullable: true
                orn_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-22T09:05:25'
                  nullable: true
                adrec_license_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-22T09:05:25'
                  nullable: true
                other_license:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: msjuryvojcybzvrbyickz
                  nullable: true
                other_license_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-22T09:05:25'
                  nullable: true
                position:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: nkygloigmkwxphlvazjrc
                  nullable: true
                linkedin_url:
                  type: string
                  description: 'Must be a valid URL. Must not be greater than 255 characters.'
                  example: 'http://www.dubuque.com/fuga-a-debitis-autem.html'
                  nullable: true
                spoken_languages:
                  type: array
                  description: ''
                  example:
                    - consequatur
                  items:
                    type: string
                experience_since:
                  type: string
                  description: ''
                  example: null
                bio_ar:
                  type: string
                  description: 'Must not be greater than 2000 characters.'
                  example: mqeopfuudtdsufvyvddqa
                  nullable: true
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: mniihfqcoynlazghdtqtq
                company_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: xbajwbpilpmufinllwloa
                  nullable: true
                phone:
                  type: string
                  description: ''
                  example: null
                phone_country_code:
                  type: string
                  description: ''
                  example: null
                nationality:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: uydlsmsjuryvojcybzvrb
                  nullable: true
                emirates_id_no:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: yickznkygloigmkwxphlv
                  nullable: true
                passport_no:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: azjrcnfbaqywuxhgjjmzu
                  nullable: true
                passport_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-22T09:05:25'
                  nullable: true
                brn_number:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: xjubqouzswiwxtrkimfca
                  nullable: true
                affiliated_brokerage:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: tbxspzmrazsroyjpxmqes
                  nullable: true
                trade_license_no:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: edyghenqcopwvownkbaml
                  nullable: true
                trade_license_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-22T09:05:25'
                  nullable: true
                orn_number:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: nfngefbeilfzsyuxoezbd
                  nullable: true
                adrec_license_no:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: tabptcyyerevrljcbwkth
                  nullable: true
                trn_number:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: jnescwsestcouxpqsydki
                  nullable: true
                trn_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-22T09:05:25'
                  nullable: true
                authorized_signatory_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: gioyoyprjkfdjsneawgaa
                  nullable: true
                landline:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: vuiwlezlcraoooxrrjhbd
                  nullable: true
                office_address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: uowtbaqrrtgxiuvujtzci
                  nullable: true
                bio:
                  type: string
                  description: 'Must not be greater than 2000 characters.'
                  example: rplnfqsaymxpayeblqozc
                  nullable: true
                years_of_experience:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 80.'
                  example: 11
                  nullable: true
                preferred_areas:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: azplqjijwkuzgpjfumffs
                  nullable: true
                website:
                  type: string
                  description: 'Must be a valid URL. Must not be greater than 255 characters.'
                  example: mqnmbekhsobzoqisjmbiu
                  nullable: true
                founding_year:
                  type: string
                  description: ''
                  example: null
                metadata:
                  type: object
                  description: ''
                  example: null
                  properties:
                    meta_title:
                      type: string
                      description: 'Must not be greater than 255 characters.'
                      example: qxdnvttnwpjqkxxmutyza
                      nullable: true
                    meta_description:
                      type: string
                      description: 'Must not be greater than 500 characters.'
                      example: adbjkbosusobdoqhlrecw
                      nullable: true
                    meta_keywords:
                      type: string
                      description: 'Must not be greater than 500 characters.'
                      example: gwnfrnqkqzoekemczcjka
                      nullable: true
                    canonical_url:
                      type: string
                      description: 'Must be a valid URL. Must not be greater than 2048 characters.'
                      example: 'http://www.walker.com/'
                      nullable: true
                    og_title:
                      type: string
                      description: 'Must not be greater than 255 characters.'
                      example: wxjfjhqnumftkwbfqsgay
                      nullable: true
                    og_description:
                      type: string
                      description: 'Must not be greater than 500 characters.'
                      example: wjxhjqovkxzlvalyuwppf
                      nullable: true
                    other_meta_tags:
                      type: string
                      description: ''
                      example: consequatur
                      nullable: true
                  nullable: true
                metadata_og_image:
                  type: string
                  format: binary
                  description: 'Must be an image. Must not be greater than 4096 kilobytes.'
                  nullable: true
                remove_metadata_og_image:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
              required:
                - section
      security: []
  /api/crm/profile/avatar:
    post:
      summary: 'Profile photo / logo'
      operationId: profilePhotoLogo
      description: 'Shown on the public agent / agency pages. Multipart, at least 120 × 120 px, max 4 MB.'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - Entry
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:

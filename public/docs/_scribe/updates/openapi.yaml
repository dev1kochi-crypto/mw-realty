openapi: 3.0.3
info:
  title: 'MW Realty — Latest API Updates'
  description: 'Only the endpoints added or changed in the latest updates: AI chat & matching, Property Details sections, calculators, cross-border compare, trust engine, listing automation, market demand.'
  version: 1.0.0
servers:
  -
    url: 'https://mw.realty.mightywarnersdemo.com'
tags:
  -
    name: 'AI chat & property matching'
    description: "**Features 1 & 5 — AI property matching engine + conversational assistant.** The buyer describes what they want in their own words (\"a two-bedroom apartment in Abu Dhabi, near schools, with rental income potential, a manageable service charge and a 20-minute commute\"); the assistant turns it into a brief (`requirements`) and returns real listings **ranked** against it, each card with a `match` (`score` 0–100, `reasons`, `misses`). Near misses (one bedroom more, a little over budget) still show, lower down, with the reason.\n\n**Flow**\n\n1. Chat screen opens → `GET /api/chatbot/session` (send `X-Device-Id`; a customer token identifies the user). Show `languages` as \"Choose your language\".\n2. Each message → `POST /api/chatbot/message` with `message`, `conversation_id`, `lang` (listing text) and `language` (chat language). Render `reply`, then `properties` as cards with their `match`.\n3. When a reply (or a `422`) has `details_required: true`, show the details form → `POST /api/chatbot/start`, then resend the message.\n4. \"Clear chat\" → `POST /api/chatbot/reset`.\n\n**What is scored:** budget, bedrooms, nearby places (school, metro, mall, beach, … — the places tagged on the listing), investment purpose, size, bathrooms, furnishing. Service charge, financing and commute are captured in `requirements` for the agent but are not in the listing data, so they are not scored. A loosely-worded place (\"the Ranches area\") falls back to its meaningful words, so it still finds Arabian Ranches.\n\n**Server setup (backend, `.env`):** `CHATBOT_PROVIDER=groq` (default) or `gemini`; `GROQ_API_KEY` / `GROQ_MODEL` (default `openai/gpt-oss-120b`) or `GEMINI_API_KEY` / `GEMINI_MODEL`; optional `CHATBOT_NAME` (persona, default \"Noor\"). Without a key the chat answers with the `unavailable` text instead of failing. The chat languages and their fixed strings are in `config/chatbot.php`. Limits: 8 messages/min and 150/day per IP.\n\n**Agent side:** the captured brief and the transcript appear on the website lead in the CRM (`GET /api/crm/website-leads/{id}/insights`)."
  -
    name: 'Property Details — new sections'
    description: "The new sections of the Property Details page and the endpoint behind each one. Load the page with `GET /api/properties/{slug}`, then the sections **separately** (they are slower and can show a loading state):\n\n| Section | Endpoint | Shown for |\n|---|---|---|\n| Mortgage / Investment calculator (two tabs) | none — calculated on the device, see **Calculators**; the Investment tab is seeded from `insights` | sale listings |\n| Rental costs (move-in costs) | none — calculated on the device, see **Calculators** | rent listings |\n| Market & investment insights (price vs area, estimated rent, gross / net yield, growth, trend chart) | `GET /api/properties/{slug}/insights` | all |\n| Buyer demand (+ AI written overview) | `GET /api/properties/{slug}/demand`, `GET /api/properties/{slug}/demand/summary` | all |\n| Nearby places map | `nearby` and `map` in `GET /api/properties/{slug}` | when set |\n| Add to compare | see **Cross-border compare** | all |\n\nThe market figures in `insights` carry a `source` — `verified` (from recorded transactions, label \"Verified · n deals\") or `asking` (from listing prices, label \"Estimate · n listings\") — and a `count`. Show it, so estimates are never presented as verified data.\n\n**Also uses (connected):**\n\n* `GET /api/compare` — see **Cross-border compare**\n* `GET /api/currencies` — see **Cross-border compare**"
  -
    name: Calculators
    description: "**Feature 3 — investment intelligence.** The calculators run **on the device**: the API gives only the page content (`GET /api/calculators`, `GET /api/calculators/{key}`) and, on Property Details, the market figures that seed them (`GET /api/properties/{slug}/insights`). Calculate in AED and convert for display with `GET /api/currencies`. The website's code is in `resources/js/components/calculators/finance.js` and `resources/js/components/insights/investment.js` — port it as-is so the app shows the same numbers.\n\n### 1. Mortgage calculator (Property Details \"Mortgage\" tab, and `/calculators/mortgage`)\n\nInputs: price (from the listing), residency, down payment %, interest rate (1–10%), term (max 25 years).\n\n| Residency | Min. down payment ≤ AED 5M | > AED 5M | Starting rate |\n|---|---|---|---|\n| UAE National | 15% | 25% | 4.24% |\n| UAE Resident | 20% | 30% | 3.75% |\n| Non-resident | 40% | 40% | 4.19% |\n\nDown payment max is 80%. Changing residency resets the down payment to its minimum and the rate to its starting rate.\n\n```\nloan     = price × (1 − down% / 100)\nr        = rate% / 100 / 12          n = years × 12\nmonthly  = loan × r × (1+r)^n / ((1+r)^n − 1)      (loan / n when r = 0)\ntotal    = monthly × n               interest = total − loan\n```\n\nPurchase costs (Dubai), shown under it — mortgage items only when there is a loan:\n\n| Item | Amount |\n|---|---|\n| Land Department fee | 4% of price + AED 580 |\n| Registration trustee | AED 4,000 + 5% VAT |\n| Mortgage registration | 0.25% of loan + AED 10 |\n| Agency fee | 2% of price + 5% VAT |\n| Bank arrangement | 1% of loan + 5% VAT |\n| Valuation | AED 3,000 + 5% VAT |\n\n### 2. Investment calculator (Property Details \"Investment\" tab, sale listings)\n\nStarting values: **rent** = `insights.estimates.annual_rent.amount` (else 6% of the price); **service charges** = size (sq.ft) × `insights.assumptions.service_charge_psf`; **maintenance %** and **vacancy %** from `insights.assumptions` (defaults 12 AED/sq.ft, 1%, 5%). Every value can be changed; plus residency / down payment / rate / term as in the mortgage calculator, and holding period (default 5 years).\n\n```\nloan          = price × (1 − down%/100)        down = price − loan\nfees          = purchase costs above            upfront = down + fees\nmonthlyLoan   = monthly(loan, rate, years)\neffectiveRent = rent × (1 − vacancy%/100)\nmaintenance   = price × maintenance%/100\nrunningCosts  = serviceCharges + maintenance                (a year)\nNOI           = effectiveRent − runningCosts\ncashFlow/yr   = NOI − monthlyLoan × 12                       (show /12 as monthly)\ngrossYield    = rent / price × 100\nnetYield      = NOI / (price + fees) × 100\ncashOnCash    = cashFlow/yr / upfront × 100\n-- over the holding period (hold years) --\nloanPaid      = monthlyLoan × min(hold, years) × 12\nloanBalance   = balance after hold×12 instalments\nloanInterest  = loanPaid − (loan − loanBalance)\ntotalCost     = upfront + loanPaid + runningCosts × hold\nrentIncome    = effectiveRent × hold        netCost = totalCost − rentIncome\n```\n\n**Financing scenarios** table: the same calculation for down payments of the minimum, 40%, 60%, 100% (cash) and the user's own choice.\n\n### Rental costs (rent listings)\n\nAnnual rent = price × periods per year (yearly 1, monthly 12, weekly 52, daily 365). Security deposit = the listing's `pricing.security_deposit`, else 5% of the annual rent (10% furnished); agency fee 5% (editable) + VAT; Ejari / Tawtheeq AED 220; utility deposit AED 2,000 (apartment) / 4,000 (villa, townhouse); housing fee 5% of the rent in Dubai, 3% in Abu Dhabi. Refundable: the two deposits. Year one = rent + housing fee + move-in costs − refundable.\n\nThe other two calculator pages (`eligibility`, `rent-vs-buy`, `refinance`) use the same `finance.js` helpers; `settings` in `GET /api/calculators/{key}` holds their admin-editable options (e.g. the refinance lender list).\n\n**Also uses (connected):**\n\n* `GET /api/properties/{slug}/insights` — see **Property Details — new sections**\n* `GET /api/currencies` — see **Cross-border compare**"
  -
    name: 'Cross-border compare'
    description: "**Feature 4 — cross-border property intelligence.** Compare 2–5 listings in any UAE emirate side by side in one shape: price, size, price per sq.ft, buying costs under each emirate's fees (move-in costs for rentals), market estimates, ownership rules, Golden Visa — with a written AI summary in the buyer's currency.\n\nThe money and investment figures are **locked** until the visitor leaves contact details: `POST /api/contact` with `source=compare` returns a token; send it as `X-Compare-Unlock` on both compare endpoints. Amounts in `GET /api/compare` are AED — convert with `GET /api/currencies`; the summary takes `currency` itself."
  -
    name: 'Trust engine (CRM)'
    description: "**Feature 2 — property authenticity and trust engine.** Automated screening flags listings for a **human review** — it never claims a listing is verified by AI: the same unit already listed by another agency (duplicate photos via image hashing, shown side by side with the price spread; the first listing stays live, newer ones wait), price far off the area, advert details not matching the permit, resubmitted listings. Super Admin approves or rejects each one. Permits are checked when a listing is created (`POST /api/crm/properties/permit/validate`) and reviewed in the permit queue.\n\nCRM endpoints: sign in with `POST /api/crm/auth/login` and send `Authorization: Bearer {token}`."
  -
    name: 'Listing automation (CRM)'
    description: "**Feature 6 — agency listing automation.** Agencies bulk-upload their inventory from a spreadsheet (or another CRM's export): upload → the columns are matched to our fields → confirm → the import runs in the background (poll its progress) → download the file back with an Import Status / Remarks column per row. Descriptions are standardised and missing information reported per row. In the listing form, **Write with AI** drafts the title / description from the details and **Auto-translate** fills the other languages.\n\nCRM endpoints: `Authorization: Bearer {token}` from `POST /api/crm/auth/login`."
  -
    name: 'Market demand'
    description: "**Feature 7 — property demand and market analytics.** Anonymised, aggregated marketplace demand (searches, views, saves, enquiries vs listing supply) — never an individual lead or visitor. On the website it is the **Buyer demand** section of Property Details; in the CRM it is the **Market Demand** page for agencies and developers (where buyers look, underserved bedroom counts and price bands, month-by-month change), a plan feature (`market_demand`).\n\n**Also uses (connected):**\n\n* `GET /api/properties/{slug}/demand` — see **Property Details — new sections**\n* `GET /api/properties/{slug}/demand/summary` — see **Property Details — new sections**"
  -
    name: 'Performance insights (CRM)'
    description: "Other recent CRM updates: how each listing performs (views, impressions, enquiries, insight views), the agency's agents compared, and lead insights."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/auth/login</code>, <code>/api/auth/verify-otp</code> or <code>/api/auth/google</code>, and send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  '/api/crm/website-leads/{websiteLead_id}/insights/summary':
    get:
      summary: 'Insights panel'
      operationId: insightsPanel
      description: 'Stats, engagement, most interested properties and the first page of each list (VisitorInsights::summaryJson).'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {}
      tags:
        - 'AI chat & property matching'
      security: []
    parameters:
      -
        in: path
        name: websiteLead_id
        description: 'The ID of the websiteLead.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/crm/website-leads/{websiteLead_id}/insights':
    get:
      summary: 'Insights panel — next page of a list'
      operationId: insightsPanelNextPageOfAList
      description: 'The next page of its timeline / favorites / saved searches / chats (load on scroll).'
      parameters:
        -
          in: query
          name: section
          description: 'timeline | favorites | searches | chats | messages.'
          example: timeline
          required: true
          schema:
            type: string
            description: 'timeline | favorites | searches | chats | messages.'
            example: timeline
        -
          in: query
          name: after
          description: 'The last id already shown.'
          example: 120
          required: false
          schema:
            type: integer
            description: 'The last id already shown.'
            example: 120
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {}
      tags:
        - 'AI chat & property matching'
      security: []
    parameters:
      -
        in: path
        name: websiteLead_id
        description: 'The ID of the websiteLead.'
        example: 1
        required: true
        schema:
          type: integer
  /api/chatbot/session:
    get:
      summary: 'Open chat'
      operationId: openChat
      description: "Call when the chat screen opens: is this device's user known yet, and the latest\nconversation to continue. Needs the `X-Device-Id` header; a customer token makes the\nuser known automatically.\n\nWidget opened: is this visitor known yet, and the latest conversation to pick up from.\n\n`languages` are the languages the assistant chats in (show them as \"Choose your language\");\n`language` is the one this conversation is in (null until the user picks one). Send the\nchosen code as `language` with each message."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  identified: false
                  details_required: false
                  conversation_id: null
                  requirements: null
                  language: null
                  default_language: en
                  languages:
                    -
                      code: ar
                      name: Arabic
                      native: العربية
                      dir: rtl
                      speech: ar-AE
                      strings:
                        welcome: …
                        placeholder: …
                        switch_offer: …
                        switched: …
                        error: …
                  messages: []
                properties:
                  identified:
                    type: boolean
                    example: false
                  details_required:
                    type: boolean
                    example: false
                  conversation_id:
                    type: string
                    example: null
                    nullable: true
                  requirements:
                    type: string
                    example: null
                    nullable: true
                  language:
                    type: string
                    example: null
                    nullable: true
                  default_language:
                    type: string
                    example: en
                  languages:
                    type: array
                    example:
                      -
                        code: ar
                        name: Arabic
                        native: العربية
                        dir: rtl
                        speech: ar-AE
                        strings:
                          welcome: …
                          placeholder: …
                          switch_offer: …
                          switched: …
                          error: …
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: ar
                        name:
                          type: string
                          example: Arabic
                        native:
                          type: string
                          example: العربية
                        dir:
                          type: string
                          example: rtl
                        speech:
                          type: string
                          example: ar-AE
                        strings:
                          type: object
                          properties:
                            welcome:
                              type: string
                              example: …
                            placeholder:
                              type: string
                              example: …
                            switch_offer:
                              type: string
                              example: …
                            switched:
                              type: string
                              example: …
                            error:
                              type: string
                              example: …
                  messages:
                    type: array
                    example: []
      tags:
        - 'AI chat & property matching'
      security: []
  /api/chatbot/start:
    post:
      summary: 'Share contact details'
      operationId: shareContactDetails
      description: "Shown when a reply has `details_required: true` (after the first free question, for\nguests). Identifies the user and continues the conversation they started.\n\nThe details form — identifies the visitor (switching this browser to them; their anonymous\nchat is attached by VisitorTracker)."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  conversation_id: 44
                  name: 'Sara Ahmed'
                properties:
                  conversation_id:
                    type: integer
                    example: 44
                  name:
                    type: string
                    example: 'Sara Ahmed'
      tags:
        - 'AI chat & property matching'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: 'Sara Ahmed'
                email:
                  type: string
                  description: ''
                  example: buyer@example.com
                phone:
                  type: string
                  description: ''
                  example: '501234567'
                phone_country_code:
                  type: string
                  description: ''
                  example: '+971'
                conversation_id:
                  type: integer
                  description: 'The current conversation, if any.'
                  example: null
                  nullable: true
                recaptcha_token:
                  type: string
                  description: 'See "Forms & reCAPTCHA" in the introduction.'
                  example: null
                  nullable: true
              required:
                - name
                - email
                - phone
      security: []
  /api/chatbot/reset:
    post:
      summary: 'New conversation'
      operationId: newConversation
      description: '"Clear chat" — the old transcript is kept on the server, the user just starts fresh.'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  conversation_id: 45
                properties:
                  conversation_id:
                    type: integer
                    example: 45
      tags:
        - 'AI chat & property matching'
      security: []
  /api/chatbot/message:
    post:
      summary: 'Send a message'
      operationId: sendAMessage
      description: "Ask the AI assistant. The reply may include matching property cards. Limited to 8\nmessages/minute and 150/day per IP."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  reply: 'Here are some 2-bedroom apartments in Dubai Marina:'
                  properties:
                    -
                      id: 111
                      slug: virella-2
                      image: 'https://.../photo.jpg'
                      match:
                        score: 92
                        reasons:
                          - 'Within budget'
                          - '2 bedrooms'
                          - 'Near school'
                        misses: []
                      '...': 'same card shape as GET /api/properties'
                  pagination:
                    current_page: 1
                    last_page: 1
                    total: 6
                  requirements:
                    location: 'Dubai Marina'
                    bedrooms: '2'
                    max_price: 2000000
                    nearby:
                      - school
                    purpose: invest
                  error: false
                  conversation_id: 44
                  details_required: false
                properties:
                  reply:
                    type: string
                    example: 'Here are some 2-bedroom apartments in Dubai Marina:'
                  properties:
                    type: array
                    example:
                      -
                        id: 111
                        slug: virella-2
                        image: 'https://.../photo.jpg'
                        match:
                          score: 92
                          reasons:
                            - 'Within budget'
                            - '2 bedrooms'
                            - 'Near school'
                          misses: []
                        '...': 'same card shape as GET /api/properties'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 111
                        slug:
                          type: string
                          example: virella-2
                        image:
                          type: string
                          example: 'https://.../photo.jpg'
                        match:
                          type: object
                          properties:
                            score:
                              type: integer
                              example: 92
                            reasons:
                              type: array
                              example:
                                - 'Within budget'
                                - '2 bedrooms'
                                - 'Near school'
                              items:
                                type: string
                            misses:
                              type: array
                              example: []
                        '...':
                          type: string
                          example: 'same card shape as GET /api/properties'
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 6
                  requirements:
                    type: object
                    properties:
                      location:
                        type: string
                        example: 'Dubai Marina'
                      bedrooms:
                        type: string
                        example: '2'
                      max_price:
                        type: integer
                        example: 2000000
                      nearby:
                        type: array
                        example:
                          - school
                        items:
                          type: string
                      purpose:
                        type: string
                        example: invest
                  error:
                    type: boolean
                    example: false
                  conversation_id:
                    type: integer
                    example: 44
                  details_required:
                    type: boolean
                    example: false
        422:
          description: 'Guest must share details first'
          content:
            application/json:
              schema:
                type: object
                example:
                  details_required: true
                  message: 'Please share your details to keep chatting.'
                properties:
                  details_required:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Please share your details to keep chatting.'
      tags:
        - 'AI chat & property matching'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: ''
                  example: 'Show me 2 bedroom apartments in Dubai Marina under 2M'
                conversation_id:
                  type: integer
                  description: 'From open chat / share details.'
                  example: null
                  nullable: true
                lang:
                  type: string
                  description: 'Website language — the listing text on the cards.'
                  example: en
                  nullable: true
                language:
                  type: string
                  description: 'Chat language the user picked (a `languages` code from Open chat) — the assistant replies in it whatever language the message is in.'
                  example: "ar\n\nThe buyer can describe what they want in their own words (budget, area, near schools,\nrental income, commute, …): `requirements` is everything captured so far in this\nconversation, and the cards are ranked against it — each has `match` with a 0-100 `score`\n(null when there's nothing to score on), `reasons` and `misses`."
                  nullable: true
              required:
                - message
      security: []
  '/api/properties/{slug}':
    get:
      summary: 'Property details'
      operationId: propertyDetails
      description: "The full listing: gallery, price, specs, description, amenities, location, agent/agency\ncontact, floor plans, open house days, similar listings and SEO. Use the property's `id`\nfrom here for wishlist and lead endpoints."
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not found'
                properties:
                  message:
                    type: string
                    example: 'Not found'
      tags:
        - 'Property Details — new sections'
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The listing slug from a property card.'
        example: virella-2
        required: true
        schema:
          type: string
  '/api/properties/{slug}/insights':
    get:
      summary: 'Market & investment insights'
      operationId: marketInvestmentInsights
      description: "The listing's Market & Investment panel: asking and verified (closed-deal) price summaries for\nthe same type in the same area, estimated value / annual rent, gross yield, price vs market,\nyear-on-year growth, a quarterly price-per-sq.ft trend, recent closed deals, the automated\nassessment badge and the starting assumptions for the investment calculator. Every estimate\ncarries `source` (verified | asking) and `count`. Amounts in AED; rents annual."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not found'
                properties:
                  message:
                    type: string
                    example: 'Not found'
      tags:
        - 'Property Details — new sections'
      security: []
    parameters:
      -
        in: path
        name: slug
        description: ''
        example: virella-2
        required: true
        schema:
          type: string
  '/api/properties/{slug}/demand':
    get:
      summary: 'Buyer demand'
      operationId: buyerDemand
      description: "The listing's Buyer Demand block, from anonymised, aggregated activity on MW Realty (searches,\nsaved searches, listing views, favourites, enquiries — counted as different browsers per day):\ndemand level for its segment (same type + bedrooms) against its city, last 30 days vs the 30\nbefore, price benchmark, demand vs supply by bedrooms and price band, monthly trend, most\nwanted amenities and key findings (`insights`, as keys + values for the page to word).\n`available: false` when the listing has no city / community. Counts below `fewer_than` are null."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not found'
                properties:
                  message:
                    type: string
                    example: 'Not found'
      tags:
        - 'Property Details — new sections'
      security: []
    parameters:
      -
        in: path
        name: slug
        description: ''
        example: virella-2
        required: true
        schema:
          type: string

openapi: 3.0.3
info:
  title: 'MW Realty — CRM API'
  description: 'REST API for the agent / company CRM (web app and mobile app).'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: 'CRM Account'
    description: "\nThe bell icon — the signed-in account's notifications (new leads, imports finished, KYC\napproved…). For an agent / company their own; for a Super Admin (web app) the CMS admin's."
  -
    name: 'CRM Agents'
    description: "\nAgent roster: Super Admin sees every agent across every agency; a Company manages only its own —\nevery membership is looked up already scoped to that agency (findMembership()) and then checked\nby AgencyAgentPolicy, so another agency's agent id 404s. An Agent-type login has no access here\n(its side is My Agency).\n\nAdding a brand-new agent or inviting an existing one both need Super Admin approval before the\nagent becomes active; all state changes go through AgencyMembershipService. Lead assignment\nsettings and \"distribute unassigned\" are the Leads endpoints (/leads/assignment-settings, /leads/distribute)."
  -
    name: 'CRM Auth'
    description: "\nToken (Bearer) sign-in for the CRM mobile app — **agents and agencies** only.\n\nSame accounts and the same checks as the website's portal login (Portal\\PortalAuthController):\npassword, then — when the account has two-factor on — an emailed code for a device it hasn't\nsigned in from before, then the authenticator-app code. The steps are linked by the\n`challenge_token` returned by each step instead of a session.\n\nKeep the `device_token` returned on success and send it with the next login, so a known\ndevice skips the emailed code. Send the `token` on every other request:\n`Authorization: Bearer {token}`."
  -
    name: 'CRM Contact Us'
    description: "\nContact Us for agents/companies — a support-ticket desk: raise a ticket with an issue type,\nfollow its status, and keep the conversation with MW Realty support in one thread.\nAgent / company accounts only (Super Admin answers tickets in the CMS); every query is scoped\nto the signed-in account's own tickets, so another account's ticket id is a 404."
  -
    name: 'CRM Dashboard'
    description: "\nThe signed-in account's dashboard — everything scoped to its own leads and listings; a Super\nAdmin (web app) sees every account's. Reachable before KYC approval.\n\nLinks (`alerts`, `shortcuts`) carry `route` (a CRM screen: name + query) or `url` (a page not\nin the CRM app yet)."
  -
    name: 'CRM Integrations'
    description: "\nThe Integrations hub: one card per integration with its status; each opens its own screen\n(FacebookController, PropertyFinderController). A new integration is a new entry here plus its screen."
  -
    name: 'CRM Integrations — Facebook Lead Ads'
    description: "\nFacebook Pages whose Lead Ads leads arrive in an agency's / agent's CRM.\n\nConnect (GET connect-url) → Facebook Login → the public callback (no CRM login needed — the\none-time state in the cache names who started it) lists the Pages the Facebook user manages →\nthe Super Admin links each Page to an agency or independent agent, or any agency / agent\nconnects Pages to their own account (an agency agent's become their personal leads) → each is\nsaved with its Page token and subscribed to the app's \"leadgen\" webhook (Api\\FacebookWebhookController).\nA Page belongs to one account only: the webhook names just the Page, so it must point to a single\nCRM (never the admin's own). \"Sync now\" pulls recent leads directly (FacebookLeadImporter::sync)."
  -
    name: 'CRM Integrations — Property Finder'
    description: "\n  Agency / independent agent: connect with their API key + secret (verified with Property Finder\n  first), sync — \"Import all listings\" the first time, then \"Sync new listings\" — and disconnect.\n  Agency agent: sees the agency's connection (key masked) and may sync it; can't change it.\n  Super Admin: reviews every imported listing (approve / reject) before it can go live."
  -
    name: 'CRM Lead Insights'
    description: "\nYour leads that came from the website, ranked by how engaged they are — property views, time\non site, searches, AI chats, last activity. Same scoping as Leads (Super Admin sees every lead)."
  -
    name: 'CRM Leads'
    description: "\nAn agent / company's leads — a Super Admin (web app) sees every account's. Approved accounts\nonly (a pending one gets 403). All querying, statistics and owner rules go through\nLeadService, so the same rules apply here, on the dashboard, and in the Excel import/export.\n\nSelection-based actions (bulk stage / tags / delete, export) take either `ids` (the ticked\nleads) or `select_all: true` + the listing's filters (+ `exclude_ids` unticked afterwards) =\nevery lead matching the filters, on every page."
  -
    name: 'CRM Listing Permits'
    description: "\nSuper Admin only: which listings' advertising permits are verified. The agency / agent validates\nthe permit in the property form (DLD / ADREC). Where Super Admin approval applies\n(LISTING_SUPERADMIN_APPROVAL on, or a DTCM / None permit) the listing waits here to be approved;\notherwise a verified listing goes live by itself. Super Admin can take any listing down.\nRules: ListingComplianceService."
  -
    name: 'CRM Listing Settings'
    description: "\nListings Settings → Watermark.\n - Agency / independent agent: the logo / text stamped onto every listing photo they upload from\n   now on. An agency's agents use the agency's watermark (read-only for them). Without one of\n   their own, Super Admin's default watermark is used.\n - Super Admin: the default watermark (its own listings + every account without one), and the\n   \"Agency & agent watermarks\" list — who has set their own, searched and paged on the server.\nWatermark images are on a private disk: GET /listing-settings/watermark/image."
  -
    name: 'CRM Marketing Properties'
    description: "\nSuper Admin only: pick agencies / agents, add their listings to the home \"Realty Property\" list\nand order it. The first `home_limit` show on the home page, all of them on /marketing-properties.\nLogic: MarketingPropertyService."
  -
    name: 'CRM Master'
    description: "\nThe stages, tags and sources used on leads — your own, plus MW Realty's shared ones\n(`is_global: true`), which you can use but not change. A Super Admin manages the shared ones\n(through the shared \"Admin\" owner, see OwnerContext::effectiveOwnerId()). Approved accounts only."
  -
    name: 'CRM Master — Property Options'
    description: "\nSuper Admin only: the option lists behind the property form's Property Type, Listing Type,\nCompletion Status and Furnishing dropdowns, plus the Nearby Places \"Type\" dropdown — the same\nFilter / FilterValue records the website filters use. Agents / agencies ask for new options via a ticket."
  -
    name: 'CRM Nearby Places'
    description: "\nNearby landmarks (schools, hospitals, restaurants, attractions, ...) that properties can be\ntagged with — see Property::nearbyPlaces() / the property form's \"Nearby Places\" tab.\n\nSuper Admin (portal_user_id NULL, \"Shared\") and Agents/Companies can all add places, and every\nplace is visible to and usable by everyone. Editing/toggling/deleting is limited to whoever added\nit (Super Admin can manage any), and a place still tagged on a property can't be deleted.\nownerId() null means Super Admin, same as the properties side."
  -
    name: 'CRM Plans'
    description: "\nPlans & billing for the signed-in agent / company. With Stripe on: a first subscription is paid\non our checkout page (card fields are Stripe Elements — POST /plans/checkout/intent, confirm the\ncard with Stripe, then POST /plans/checkout/complete); an existing one is upgraded now, downgraded\nat renewal or cancelled at period end (preview first with POST /plans/change-preview). Without\nStripe, a plan change is a request Super Admin approves. An agency agent is on the agency's plan\n(`agency_plan`) and has nothing to buy."
  -
    name: 'CRM Premium'
    description: "\nThe Premium menu: every premium (live or scheduled) listing across Properties and Commercial, plus\n\"Add Premium\" to book several listings at once within the plan's quota. A single listing is booked,\nre-dated or stopped through /properties/{id}/feature (PropertyFeatureController)."
  -
    name: 'CRM Properties'
    description: "\nProperties and Commercial listings — the same table, form and screens, split only by `segment`\n(residential | commercial); plan property limits count both. Super Admin sees every listing; an\nAgent / Company sees and can only touch their own (an agency agent also the agency listings\nassigned to them — view / edit only)."
  -
    name: 'CRM Properties — Form helpers'
    description: "\nLookups the property form and the listing filters use: the permit Validate button, auto-translate,\nthe Nearby Places type → place picker and the agent filter."
  -
    name: 'CRM Properties — Gallery'
    description: "\nA listing's saved photos — `{reference_no}-{n}.jpeg`, shown in `image_sequence` order. New photos\nare uploaded with the listing form (images[])."
  -
    name: 'CRM Properties — Performance'
    description: ''
  -
    name: 'CRM Properties — Premium'
    description: "\nMake a listing premium for a start + end date (listing cards and the Featured menu). Agents /\ncompanies spend their plan's quota within its max duration; Super Admin has no limits and may\nleave the end date open. See FeaturedListingService."
  -
    name: 'CRM Properties — Sold / rented'
    description: "\n\"Mark as sold / rented\" on a listing card, and the paged buyer-lead picker it uses. The listing\nmoves to Sold Listings; the buyer lead moves to the won stage. See PropertySaleService."
  -
    name: 'CRM Reports'
    description: "\nReports — Leads, Properties, Sales and (agencies only) Agents. The whole section is a plan\nentitlement (plans.reports_access): without it every report answers `locked` (with the plan to\nmention) instead of data. Super Admin always has it and sees every account's data.\nChart series come as `{labels: [], values: []}`."
  -
    name: 'CRM Sold Listings'
    description: "\nListings marked sold or rented (PropertySaleController::markSold), their proof documents, and\nreverting one to put it back on the market. Same scoping as Properties (Super Admin = every listing)."
  -
    name: 'CRM Website Leads'
    description: "\nSuper Admin only (web app, CMS session): everyone who identified themselves on the website — AI\nchat, contact / landing page / enquiry forms, customer accounts — with their tracked activity.\n\"Lead Pool\" = not routed to any agency / agent yet (they never opened a listing that has one);\nSuper Admin transfers those — one, a selection, or every lead matching the filters. See VisitorTracker."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/crm/auth/login</code> and send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/crm/notifications:
    get:
      summary: Notifications
      operationId: notifications
      description: "Newest first, 20 per page. `route` = the CRM screen it opens (name + params), when it has\none; otherwise open `url`."
      parameters:
        -
          in: query
          name: page
          description: ''
          example: 1
          required: false
          schema:
            type: integer
            description: ''
            example: 1
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 9a1…
                      title: 'New lead'
                      message: 'Sara Ahmed enquired about…'
                      icon: fa-user-plus
                      tone: teal
                      url: 'https://…/portal/crm/leads/101'
                      route:
                        name: leads.show
                        params:
                          id: 101
                      read: false
                      created_at: '2026-10-09T10:00:00+00:00'
                  unread_count: 3
                  next_page: null
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 9a1…
                        title: 'New lead'
                        message: 'Sara Ahmed enquired about…'
                        icon: fa-user-plus
                        tone: teal
                        url: 'https://…/portal/crm/leads/101'
                        route:
                          name: leads.show
                          params:
                            id: 101
                        read: false
                        created_at: '2026-10-09T10:00:00+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 9a1…
                        title:
                          type: string
                          example: 'New lead'
                        message:
                          type: string
                          example: 'Sara Ahmed enquired about…'
                        icon:
                          type: string
                          example: fa-user-plus
                        tone:
                          type: string
                          example: teal
                        url:
                          type: string
                          example: 'https://…/portal/crm/leads/101'
                        route:
                          type: object
                          properties:
                            name:
                              type: string
                              example: leads.show
                            params:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 101
                        read:
                          type: boolean
                          example: false
                        created_at:
                          type: string
                          example: '2026-10-09T10:00:00+00:00'
                  unread_count:
                    type: integer
                    example: 3
                  next_page:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'CRM Account'
      security: []
  /api/crm/notifications/read-all:
    post:
      summary: 'Mark all read'
      operationId: markAllRead
      description: ''
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                properties:
                  success:
                    type: boolean
                    example: true
      tags:
        - 'CRM Account'
      security: []
  '/api/crm/notifications/{id}/read':
    post:
      summary: 'Mark one read'
      operationId: markOneRead
      description: ''
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                properties:
                  success:
                    type: boolean
                    example: true
      tags:
        - 'CRM Account'
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the notification.'
        example: consequatur
        required: true
        schema:
          type: string
  /api/crm/account/two-factor:
    get:
      summary: 'Two-factor status'
      operationId: twoFactorStatus
      description: ''
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  enabled: false
                  required: false
                  setup_required: true
                  can_skip: true
                  company_enforced: false
                  recovery_codes_left: 0
                  trusted_devices: []
                properties:
                  enabled:
                    type: boolean
                    example: false
                  required:
                    type: boolean
                    example: false
                  setup_required:
                    type: boolean
                    example: true
                  can_skip:
                    type: boolean
                    example: true
                  company_enforced:
                    type: boolean
                    example: false
                  recovery_codes_left:
                    type: integer
                    example: 0
                  trusted_devices:
                    type: array
                    example: []
      tags:
        - 'CRM Account'
      security: []
  /api/crm/account/two-factor/setup:
    post:
      summary: 'Start set-up'
      operationId: startSetUp
      description: "A new secret to add to the authenticator app — as a QR code (`qr_svg`), an `otpauth://`\nlink (`uri`, opens the app directly on the same phone) or typed in (`secret`). Moving 2FA\nthat is already on to a new phone needs the account `password`; the old app keeps working\nuntil the new one is confirmed."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  secret: JBSWY3DPEHPK3PXP
                  uri: 'otpauth://totp/MW%20Realty:agent@example.com?secret=…'
                  qr_svg: '<svg…>'
                properties:
                  secret:
                    type: string
                    example: JBSWY3DPEHPK3PXP
                  uri:
                    type: string
                    example: 'otpauth://totp/MW%20Realty:agent@example.com?secret=…'
                  qr_svg:
                    type: string
                    example: '<svg…>'
      tags:
        - 'CRM Account'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: 'Only when 2FA is already on.'
                  example: secret123
      security: []
  /api/crm/account/two-factor/confirm:
    post:
      summary: 'Confirm set-up'
      operationId: confirmSetUp
      description: "The first code the authenticator app shows. Switches 2FA on and returns the recovery\ncodes — show them once and ask the user to keep them safe. A company can pass\n`enforce: true` to make 2FA mandatory for every agent right away."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Two-factor authentication is now enabled.'
                  recovery_codes:
                    - A1B2C-D3E4F
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Two-factor authentication is now enabled.'
                  recovery_codes:
                    type: array
                    example:
                      - A1B2C-D3E4F
                    items:
                      type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "That code is not valid. Make sure you scanned the latest QR code and that your phone's time is correct."
                properties:
                  message:
                    type: string
                    example: "That code is not valid. Make sure you scanned the latest QR code and that your phone's time is correct."
      tags:
        - 'CRM Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: ''
                  example: '123456'
                enforce:
                  type: boolean
                  description: 'Company only.'
                  example: false
                  nullable: true
              required:
                - code
      security: []
  /api/crm/account/two-factor/skip:
    post:
      summary: 'Skip for now'
      operationId: skipForNow
      description: "After sign-up, when 2FA isn't required by the agency — it can be turned on later."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                properties:
                  success:
                    type: boolean
                    example: true
      tags:
        - 'CRM Account'
      security: []
  /api/crm/account/two-factor/recovery-codes:
    post:
      summary: 'New recovery codes'
      operationId: newRecoveryCodes
      description: 'The old ones stop working.'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  recovery_codes:
                    - A1B2C-D3E4F
                properties:
                  success:
                    type: boolean
                    example: true
                  recovery_codes:
                    type: array
                    example:
                      - A1B2C-D3E4F
                    items:
                      type: string
      tags:
        - 'CRM Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: ''
                  example: secret123
              required:
                - password
      security: []
  /api/crm/account/two-factor/disable:
    post:
      summary: 'Turn off'
      operationId: turnOff
      description: 'Not possible while the agency (or, for a company, its own "mandatory" switch) requires it.'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Two-factor authentication has been turned off.'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Two-factor authentication has been turned off.'
      tags:
        - 'CRM Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: ''
                  example: secret123
              required:
                - password
      security: []
  /api/crm/account/two-factor/enforce:
    post:
      summary: 'Mandatory for my company'
      operationId: mandatoryForMyCompany
      description: "Company only. The company account needs 2FA itself first — set it up with `enforce: true`\non Confirm set-up instead."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Two-factor authentication is now mandatory for all agents in your company.'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Two-factor authentication is now mandatory for all agents in your company.'
      tags:
        - 'CRM Account'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enforce:
                  type: boolean
                  description: ''
                  example: true
              required:
                - enforce
      security: []
  /api/crm/account/two-factor/forget-devices:
    post:
      summary: 'Forget other devices'
      operationId: forgetOtherDevices
      description: "Every other device needs the emailed code again on its next sign-in. From the web app this\nbrowser stays recognised; from the mobile app every device (this one included) is forgotten."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                properties:
                  success:
                    type: boolean
                    example: true
      tags:
        - 'CRM Account'
      security: []
  /api/crm/profile:
    get:
      summary: 'The profile page'
      operationId: theProfilePage
      description: "Account summary, KYC progress, every section (fields with values, ready to show / edit),\ndocuments, SEO metadata, what's still missing and the public page preview."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'CRM Account'
      security: []
    post:
      summary: 'Save one section'
      operationId: saveOneSection
      description: "Multipart for `seo` (OG image). Fields per section: see GET /profile. A change to a KYC section\n(compliance, other, licenses, identity) sends a submitted review back to \"changes requested\"."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'CRM Account'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                section:
                  type: string
                  description: 'public, compliance, contact, other, licenses, about, identity or seo.'
                  example: about
                public_email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: carolyne.luettgen@example.org
                  nullable: true
                secondary_phone:
                  type: string
                  description: 'Must match the regex /^\+?[0-9 ()\-]{6,30}$/. Must not be greater than 30 characters.'
                  example: fuudtdsufvyvddqamniih
                  nullable: true
                whatsapp_number:
                  type: string
                  description: 'Must match the regex /^\+?[0-9 ()\-]{6,30}$/. Must not be greater than 30 characters.'
                  example: fqcoynlazghdtqtqxbajw
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: bpilpmufinllwloauydls
                  nullable: true
                orn_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-09T11:12:49'
                  nullable: true
                adrec_license_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-09T11:12:49'
                  nullable: true
                other_license:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: msjuryvojcybzvrbyickz
                  nullable: true
                other_license_expiry:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-09T11:12:49'
                  nullable: true
                position:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: nkygloigmkwxphlvazjrc
                  nullable: true
                linkedin_url:
                  type: string

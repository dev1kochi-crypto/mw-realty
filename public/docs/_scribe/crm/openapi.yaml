  /api/crm/auth/login:
    post:
      summary: 'Sign in'
      operationId: signIn
      description: "Either signs in straight away (`token` in the response), or asks for the next step:\n`challenge: \"email\"` → `POST /api/crm/auth/login/verify-email`,\n`challenge: \"totp\"` → `POST /api/crm/auth/login/two-factor`, passing the `challenge_token`."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Signed in'
                    type: object
                    example:
                      token: 1|abc…
                      token_type: Bearer
                      device_token: 9fK2…
                      user:
                        id: 12
                        type: agent
                        name: 'Sara Ahmed'
                    properties:
                      token:
                        type: string
                        example: 1|abc…
                      token_type:
                        type: string
                        example: Bearer
                      device_token:
                        type: string
                        example: 9fK2…
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 12
                          type:
                            type: string
                            example: agent
                          name:
                            type: string
                            example: 'Sara Ahmed'
                  -
                    description: 'New device'
                    type: object
                    example:
                      challenge: email
                      email: sa••••@example.com
                      challenge_token: Xc3…
                    properties:
                      challenge:
                        type: string
                        example: email
                      email:
                        type: string
                        example: sa••••@example.com
                      challenge_token:
                        type: string
                        example: Xc3…
                  -
                    description: 'Two-factor on'
                    type: object
                    example:
                      challenge: totp
                      challenge_token: Xc3…
                    properties:
                      challenge:
                        type: string
                        example: totp
                      challenge_token:
                        type: string
                        example: Xc3…
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid credentials.'
                properties:
                  message:
                    type: string
                    example: 'Invalid credentials.'
      tags:
        - 'CRM Auth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: agent@example.com
                password:
                  type: string
                  description: ''
                  example: secret123
                device_name:
                  type: string
                  description: "Shown in the account's signed-in devices."
                  example: "Sara's iPhone"
                  nullable: true
                device_token:
                  type: string
                  description: "The `device_token` from this device's last sign-in."
                  example: 9fK2…
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/crm/auth/login/verify-email:
    post:
      summary: 'Verify new-device code'
      operationId: verifyNewDeviceCode

                  example: '2107-11-07'
                  nullable: true
                commission:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 9999999999999.'
                  example: 13
                  nullable: true
                notes:
                  type: string
                  description: 'Must not be greater than 2000 characters.'
                  example: qeopfuudtdsufvyvddqam
                  nullable: true
                buyer_mode:
                  type: string
                  description: 'existing | new.'
                  example: existing
                lead_id:
                  type: integer
                  description: 'With buyer_mode=existing.'
                  example: 101
                  nullable: true
                buyer:
                  type: object
                  description: ''
                  example: []
                  properties:
                    name:
                      type: string
                      description: 'This field is required when <code>buyer_mode</code> is <code>new</code>. Must not be greater than 255 characters.'
                      example: mqeopfuudtdsufvyvddqa
                      nullable: true
                    email:
                      type: string
                      description: 'Must be a valid email address. Must not be greater than 255 characters.'
                      example: eloisa.harber@example.com
                      nullable: true
                    phone:
                      type: string
                      description: 'Must not be greater than 30 characters.'
                      example: fqcoynlazghdtqtqxbajw
                      nullable: true
                    phone_country_code:
                      type: string
                      description: 'Must not be greater than 8 characters.'
                      example: bpilpmu
                      nullable: true
                ownership_document:
                  type: string
                  format: binary
                  description: 'Title deed (PDF / JPG / PNG).'
                contract_document:
                  type: string
                  format: binary
                  description: 'Form F / MOU, or the Ejari for a rental.'
                documents_password:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: finllwloauydlsmsjuryv
                  nullable: true
              required:
                - type
                - price
                - sold_at
                - buyer_mode
                - ownership_document
                - contract_document
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the property.'
        example: 82
        required: true
        schema:
          type: integer

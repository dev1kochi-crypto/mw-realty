openapi: 3.0.3
info:
  title: 'MW Realty — Customer App API'
  description: 'The endpoints the MW Realty customer app calls, by app tab: Entry, Home, Search, Saved, Activity, Account.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: Entry
    description: 'First launch: pick a language, then continue as a guest or sign in. Guests can search, view properties and send enquiries; Saved, Activity and Account need a signed-in user.'
  -
    name: Home
    description: "Buy / Rent / Commercial / New Projects switch, the search bar, recently viewed and latest listings. **Recently viewed** has no endpoint: keep the last viewed property cards on the phone.\n\n**Also uses (connected):**\n\n* `GET /api/location-suggestions` — see **Search**\n* `GET /api/properties` — see **Search**\n* `GET /api/commercial` — see **Search**\n* `GET /api/ads/slides` — see **Ads & featured**"
  -
    name: 'Ads & featured'
    description: "The ad slider on Home and Property details (MW Realty's own ads and agents' booked ads), its impression / click tracking — which is what agents see in their ad reports — and **featured (premium)** listings: `GET /api/properties?premium=1` lists only them, and `/api/home` returns its premium properties and marketing (\"Realty\") sections.\n\n**Also uses (connected):**\n\n* `GET /api/properties` — see **Search**\n* `GET /api/home` — see **Home**"
  -
    name: Search
    description: "Location search, the results list and map, filters, and the property details screen (contact, viewing, mortgage).\n\n**Also uses (connected):**\n\n* `POST /api/customer/wishlist/{property}` — see **Saved**\n* `POST /api/customer/saved-searches` — see **Saved**\n* `GET /api/ads/slides` — see **Ads & featured**"
  -
    name: Saved
    description: "Saved properties and saved searches. Signed-in users only.\n\n**Also uses (connected):**\n\n* `GET /api/customer/me` — see **Activity**\n* `GET /api/properties` — see **Search**"
  -
    name: Activity
    description: 'Enquiries and viewing requests the user sent, with their status, and the recent activity feed. Signed-in users only.'
  -
    name: Account
    description: "Profile, language and settings; help, privacy and terms; delete account.\n\n**Also uses (connected):**\n\n* `GET /api/customer/me` — see **Activity**\n* `GET /api/languages` — see **Entry**\n* `POST /api/auth/logout` — see **Entry**"
  -
    name: 'Background tracking'
    description: "Sent in the background, not tied to one tab: screen views, time on a listing and listing impressions. They feed the agents' listing stats and lead insights."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/auth/login</code>, <code>/api/auth/verify-otp</code> or <code>/api/auth/google</code>, and send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/languages:
    get:
      summary: Languages
      operationId: languages
      description: 'The languages content is available in. Send the chosen `code` as `?lang=` on every request.'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {}
      tags:
        - Entry
      security: []
  /api/currencies:
    get:
      summary: Currencies
      operationId: currencies
      description: "Prices from every endpoint are in AED; to display another currency, multiply by its `rate`\n(units per 1 AED)."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {}
      tags:
        - Entry
      security: []
  /api/static-translations:
    get:
      summary: 'UI translations'
      operationId: uITranslations
      description: "Static UI copy (labels, buttons…) as a key → text map for one language. Cache it on the\ndevice per language."
      parameters:
        -
          in: query
          name: lang
          description: 'A code from `GET /api/languages`.'
          example: en
          required: false
          schema:
            type: string
            description: 'A code from `GET /api/languages`.'
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {}
      tags:
        - Entry
      security: []
  /api/auth/register:
    post:
      summary: 'Sign up'
      operationId: signUp
      description: "Step 1 of sign-up. Creates the account and emails a 4-digit code — no token yet; call\n`POST /api/auth/verify-otp` with the returned `user_id` and the code.\n`email_sent: false` means the email failed — offer \"Resend code\"."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  otp_required: true
                  user_id: 7
                  email_sent: true
                properties:
                  otp_required:
                    type: boolean
                    example: true
                  user_id:
                    type: integer
                    example: 7
                  email_sent:
                    type: boolean
                    example: true
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: 'Sara Ahmed'
                email:
                  type: string
                  description: 'Must not already be registered.'
                  example: buyer@example.com
                phone:
                  type: string
                  description: 'Local number without the dial code.'
                  example: '501234567'
                phone_country_code:
                  type: string
                  description: 'Dial code, required with phone.'
                  example: '+971'
                password:
                  type: string
                  description: 'At least 8 characters.'
                  example: secret123
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: secret123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/auth/verify-otp:
    post:
      summary: 'Verify sign-up code'
      operationId: verifySignUpCode
      description: "Step 2 of sign-up: the 4-digit code emailed by `POST /api/auth/register`. Marks the\nemail verified and returns a Bearer token."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 12|9xQ...
                  token_type: Bearer
                  user:
                    id: 7
                    name: 'Sara Ahmed'
                    email: buyer@example.com
                    phone: null
                    location: null
                    avatar_url: null
                    email_verified: true
                properties:
                  token:
                    type: string
                    example: 12|9xQ...
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7
                      name:
                        type: string
                        example: 'Sara Ahmed'
                      email:
                        type: string
                        example: buyer@example.com
                      phone:
                        type: string
                        example: null
                        nullable: true
                      location:
                        type: string
                        example: null
                        nullable: true
                      avatar_url:
                        type: string
                        example: null
                        nullable: true
                      email_verified:
                        type: boolean
                        example: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid or expired code.'
                properties:
                  message:
                    type: string
                    example: 'Invalid or expired code.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: 'The `user_id` returned by register.'
                  example: 7
                code:
                  type: string
                  description: 'The emailed code.'
                  example: '1234'
                device_name:
                  type: string
                  description: "A label for this device's token."
                  example: 'Pixel 8'
              required:
                - user_id
                - code
      security: []
  /api/auth/resend-otp:
    post:
      summary: 'Resend sign-up code'
      operationId: resendSignUpCode
      description: ''
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'A new code has been sent.'
                properties:
                  message:
                    type: string
                    example: 'A new code has been sent.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This account is already verified.'
                properties:
                  message:
                    type: string
                    example: 'This account is already verified.'
        503:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Could not send the code right now — please try again in a moment.'
                properties:
                  message:
                    type: string
                    example: 'Could not send the code right now — please try again in a moment.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: ''
                  example: 7
              required:
                - user_id
      security: []
  /api/auth/login:
    post:
      summary: 'Sign in'
      operationId: signIn
      description: 'Email + password sign-in. Returns a Bearer token for the `Authorization` header.'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: 'Signed in'
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 12|9xQ...
                  token_type: Bearer
                  user:
                    id: 7
                    name: 'Sara Ahmed'
                    email: buyer@example.com
                    phone: '+971 50 123 4567'
                    location: 'Dubai Marina'
                    avatar_url: null
                    email_verified: true
                properties:
                  token:
                    type: string
                    example: 12|9xQ...
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7
                      name:
                        type: string
                        example: 'Sara Ahmed'
                      email:
                        type: string
                        example: buyer@example.com
                      phone:
                        type: string
                        example: '+971 50 123 4567'
                      location:
                        type: string
                        example: 'Dubai Marina'
                      avatar_url:
                        type: string
                        example: null
                        nullable: true
                      email_verified:
                        type: boolean
                        example: true
        422:
          description: 'Wrong email or password'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid credentials.'
                properties:
                  message:
                    type: string
                    example: 'Invalid credentials.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: buyer@example.com
                password:
                  type: string
                  description: ''
                  example: secret123
                device_name:
                  type: string
                  description: "A label for this device's token (shown nowhere yet, useful for support)."
                  example: 'iPhone 15 Pro'
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/auth/google:
    post:
      summary: 'Continue with Google'
      operationId: continueWithGoogle
      description: "Exchange the access token from the native Google Sign-In SDK for an app token. Links to an\nexisting account with the same email, or creates one. For the **User** account only —\nagents and agencies don't have Google sign-in (show the button only on the User tab)."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 12|9xQ...
                  token_type: Bearer
                  user:
                    id: 7
                    name: 'Sara Ahmed'
                    email: sara@gmail.com
                    phone: null
                    location: null
                    avatar_url: null
                    email_verified: true
                properties:
                  token:
                    type: string
                    example: 12|9xQ...
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7
                      name:
                        type: string
                        example: 'Sara Ahmed'
                      email:
                        type: string
                        example: sara@gmail.com
                      phone:
                        type: string
                        example: null
                        nullable: true
                      location:
                        type: string
                        example: null
                        nullable: true
                      avatar_url:
                        type: string
                        example: null
                        nullable: true
                      email_verified:
                        type: boolean
                        example: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Google sign-in failed — please try again.'
                properties:
                  message:
                    type: string
                    example: 'Google sign-in failed — please try again.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  description: 'The Google OAuth access token from the device SDK.'
                  example: ya29.a0Af...
                device_name:
                  type: string
                  description: "A label for this device's token."
                  example: 'iPhone 15 Pro'
                  nullable: true
              required:
                - access_token
      security: []
  /api/auth/forgot-password:
    post:
      summary: 'Forgot password'
      operationId: forgotPassword
      description: "Emails a reset link (opens the website's reset page). Always the same reply, whether or not\nthe email is registered."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'If an account exists for that email, a reset link has been sent.'
                properties:
                  message:
                    type: string
                    example: 'If an account exists for that email, a reset link has been sent.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: buyer@example.com
              required:
                - email
      security: []
  /api/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: "Only needed if the app handles the reset link itself (deep link\n`/reset-password?token=...&email=...`); otherwise the website page does this."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Your password has been reset — you can now sign in.'
                properties:
                  message:
                    type: string
                    example: 'Your password has been reset — you can now sign in.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This password reset token is invalid.'
                properties:
                  message:
                    type: string
                    example: 'This password reset token is invalid.'
      tags:
        - Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The token from the reset link.'
                  example: 3f9a...
                email:
                  type: string
                  description: ''
                  example: buyer@example.com
                password:
                  type: string
                  description: ''
                  example: newSecret123
                password_confirmation:
                  type: string
                  description: ''
                  example: newSecret123
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  /api/auth/logout:
    post:
      summary: 'Sign out'
      operationId: signOut
      description: 'Revokes the token used for this request (other devices stay signed in).'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Signed out.'
                properties:
                  message:
                    type: string
                    example: 'Signed out.'
      tags:
        - Entry
  /api/customer/session:
    get:
      summary: 'Session state'
      operationId: sessionState
      description: "Is someone signed in, and which property ids are in their wishlist (to draw the heart\nicons). Works without a token too — guests get `authenticated: false` instead of a 401.\n\nPublic — every page's shared session state (useWishlist.js) calls this once on load."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Signed in'
                    type: object
                    example:
                      authenticated: true
                      wishlist_ids:
                        - 12
                        - 48
                      user:
                        name: 'Sara Ahmed'
                        avatar_url: null
                    properties:
                      authenticated:
                        type: boolean
                        example: true
                      wishlist_ids:
                        type: array
                        example:
                          - 12
                          - 48
                        items:
                          type: integer
                      user:
                        type: object
                        properties:
                          name:
                            type: string
                            example: 'Sara Ahmed'
                          avatar_url:
                            type: string
                            example: null
                            nullable: true
                  -
                    description: Guest
                    type: object
                    example:
                      authenticated: false
                      wishlist_ids: []
                      user: null
                    properties:
                      authenticated:
                        type: boolean
                        example: false
                      wishlist_ids:
                        type: array
                        example: []
                      user:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Entry
      security: []
  /api/home:
    get:
      summary: 'Home screen'
      operationId: homeScreen
      description: "Every home section in one request: banner, brands, ad, developments, premium properties,\nluxury, why-choose-us, communities, popular places, testimonials, contact. Property lists\ninside are shuffled on each call.\n\n`ad` is a single ad, kept for older clients. The home ad slider shows every running ad:\nload it from **Ad slider** (`/api/ads/slides?placement=home`)."
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {}
      tags:
        - Home
      security: []
  /api/home/new-projects:
    get:
      summary: 'New projects by city'
      operationId: newProjectsByCity
      description: 'The home "Browse New Projects" section''s listings for one city tab.'
      parameters:
        -
          in: query
          name: city
          description: 'A city tab from the home response.'
          example: Dubai
          required: false
          schema:
            type: string
            description: 'A city tab from the home response.'
            example: Dubai
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {}
      tags:
        - Home
      security: []
  /api/ads:
    get:
      summary: 'Ad banner'
      operationId: adBanner
      description: "One active ad for a screen (picked at random when several run), or `false` when there is\nnone (hide the slot). Kept for older clients — the website's ad slots are sliders that show\nevery running ad: use **Ad slider** (`/api/ads/slides`)."
      parameters:
        -
          in: query
          name: placement
          description: 'home, property-details, …'
          example: home
          required: false
          schema:
            type: string
            description: 'home, property-details, …'
            example: home
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {}
      tags:
        - 'Ads & featured'
      security: []
  /api/ads/slides:
    get:
      summary: 'Ad slider'
      operationId: adSlider
      description: "Every ad running on a screen right now, in slide order (sponsored client ads first, in a\ndifferent order each time). Show them as a slider that moves on every `interval` seconds;\nan empty list means hide the slot. Report each slide once it has been on screen\n(**Ad impressions**) and taps on it (**Ad click**)."
      parameters:
        -
          in: query
          name: placement
          description: 'home, property-details, …'
          example: home
          required: false
          schema:
            type: string
            description: 'home, property-details, …'
            example: home
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  slides:
                    -
                      id: 12
                      name: 'Marina launch'
                      image_url: 'https://…'
                      mobile_image_url: null
                      image_alt: null
                      link_url: /property-details/marina-heights
                      eyebrow: 'New launch'
                      title: 'Marina Heights'
                      text: '1–3 bed apartments from AED 1.2M'
                      sponsor: 'Prime Homes'
                  interval: 6
                properties:
                  slides:
                    type: array
                    example:
                      -
                        id: 12
                        name: 'Marina launch'
                        image_url: 'https://…'
                        mobile_image_url: null
                        image_alt: null
                        link_url: /property-details/marina-heights
                        eyebrow: 'New launch'
                        title: 'Marina Heights'
                        text: '1–3 bed apartments from AED 1.2M'
                        sponsor: 'Prime Homes'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 12
                        name:
                          type: string
                          example: 'Marina launch'
                        image_url:
                          type: string
                          example: 'https://…'
                        mobile_image_url:
                          type: string
                          example: null
                          nullable: true
                        image_alt:
                          type: string
                          example: null
                          nullable: true
                        link_url:
                          type: string
                          example: /property-details/marina-heights
                        eyebrow:
                          type: string
                          example: 'New launch'
                        title:
                          type: string
                          example: 'Marina Heights'
                        text:
                          type: string
                          example: '1–3 bed apartments from AED 1.2M'
                        sponsor:
                          type: string
                          example: 'Prime Homes'
                  interval:
                    type: integer
                    example: 6
      tags:
        - 'Ads & featured'
      security: []
  /api/track/ad-impressions:
    post:
      summary: 'Ad impressions'
      operationId: adImpressions

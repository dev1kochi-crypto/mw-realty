                        type: string
                        example: '+971 50 123 4567'
                      location:
                        type: string
                        example: 'Dubai Marina'
                      avatar_url:
                        type: string
                        example: null
                        nullable: true
                      email_verified:
                        type: boolean
                        example: true
        422:
          description: 'Wrong email or password'

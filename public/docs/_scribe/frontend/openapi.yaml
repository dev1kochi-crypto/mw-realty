  /api/track/page:
    post:
      summary: 'Screen view'
      operationId: screenView
      description: "Call when a screen opens. Send the **website path** the screen corresponds to — that is\nhow views are classified: `/property-details/{slug}` = property view (counts towards the\nlisting's stats and routes the visitor to its agent), `/properties?bedrooms=2&...` = a\nsearch, anything else = a page view. Keep the returned `id` to report time spent.\n\nRequires the `X-Device-Id` header (nothing is recorded without it)."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 5821
                properties:
                  id:
                    type: integer
                    example: 5821
      tags:
        - Tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: ''
                  example: /property-details/virella-2
                title:
                  type: string
                  description: 'Screen title.'
                  example: 'Virella 2'
                  nullable: true
                referrer:
                  type: string
                  description: ''
                  example: null
                  nullable: true
              required:
                - path
      security: []

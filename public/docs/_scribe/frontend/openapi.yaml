        200:
          description: 'Signed in'
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 12|9xQ...
                  token_type: Bearer
                  user:
                    id: 7
                    name: 'Sara Ahmed'
                    email: buyer@example.com
                    phone: '+971 50 123 4567'
                    location: 'Dubai Marina'
                    avatar_url: null
                    email_verified: true
                properties:
                  token:
                    type: string

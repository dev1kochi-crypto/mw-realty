            example: null
        -
          in: query
          name: floor_plans
          description: '1 = only listings with floor plans.'
          example: null
          required: false
          schema:
            type: boolean
            description: '1 = only listings with floor plans.'
            example: null
        -
          in: query
          name: open_house
          description: '1 = only listings with upcoming open house days.'
          example: null
          required: false
          schema:
            type: boolean
            description: '1 = only listings with upcoming open house days.'
            example: null
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - Properties
      security: []
  /api/properties/map:
    get:
      summary: 'Map pins'
      operationId: mapPins
      description: "Pins for the map view. Takes every filter of `GET /api/properties` (or of\n`/api/commercial` with `segment=commercial`), plus the visible map area. Send the bounds\nof the current viewport after each pan/zoom."
      parameters:
        -
          in: query
          name: segment
          description: 'residential (default), commercial, premium or marketing.'
          example: residential
          required: false
          schema:
            type: string
            description: 'residential (default), commercial, premium or marketing.'
            example: residential
        -
          in: query
          name: south
          description: 'Viewport bounds — all four or none. e.g. `25.05`.'
          example: null
          required: false
          schema:
            type: number
            description: 'Viewport bounds — all four or none. e.g. `25.05`.'
            example: null
        -
          in: query
          name: west
          description: 'e.g. `55.10`.'
          example: null
          required: false
          schema:
            type: number
            description: 'e.g. `55.10`.'
            example: null
        -
          in: query
          name: north
          description: 'e.g. `25.30`.'
          example: null
          required: false
          schema:
            type: number
            description: 'e.g. `25.30`.'
            example: null
        -
          in: query
          name: east
          description: 'e.g. `55.40`.'
          example: null
          required: false
          schema:
            type: number
            description: 'e.g. `55.40`.'
            example: null
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - Properties
      security: []
  '/api/properties/{slug}':
    get:
      summary: 'Property details'
      operationId: propertyDetails
      description: "The full listing: gallery, price, specs, description, amenities, location, agent/agency\ncontact, floor plans, open house days, similar listings and SEO. Use the property's `id`\nfrom here for wishlist and lead endpoints."
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not found'
                properties:
                  message:
                    type: string
                    example: 'Not found'
      tags:
        - Properties
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The listing slug from a property card.'
        example: virella-2
        required: true
        schema:
          type: string
  /api/agents:
    get:
      summary: 'List agents'
      operationId: listAgents
      description: "Without `per_page` every agent is returned (the website's behaviour); pass `per_page` to\npage through them and get a `pagination` block."
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: query
          name: per_page
          description: 'Page size, max 50.'
          example: 20
          required: false
          schema:
            type: integer
            description: 'Page size, max 50.'
            example: 20
        -
          in: query
          name: page
          description: 'Used with per_page.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Used with per_page.'
            example: 1
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'Agents & Agencies'
      security: []
  '/api/agents/{slug}':
    get:
      summary: 'Agent details'
      operationId: agentDetails
      description: ''
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not found'
                properties:
                  message:
                    type: string
                    example: 'Not found'
      tags:
        - 'Agents & Agencies'
      security: []
    parameters:
      -
        in: path
        name: slug
        description: "The agent's slug from the list."
        example: sruthi-raveendran-m
        required: true

  /api/auth/register:
    post:
      summary: 'Sign up'
      operationId: signUp
      description: "Step 1 of sign-up. Creates the account and emails a 4-digit code — no token yet; call\n`POST /api/auth/verify-otp` with the returned `user_id` and the code.\n`email_sent: false` means the email failed — offer \"Resend code\"."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  otp_required: true
                  user_id: 7
                  email_sent: true
                properties:
                  otp_required:
                    type: boolean
                    example: true
                  user_id:
                    type: integer
                    example: 7
                  email_sent:
                    type: boolean
                    example: true
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - 'User Auth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: 'Sara Ahmed'
                email:
                  type: string
                  description: 'Must not already be registered.'
                  example: buyer@example.com
                phone:
                  type: string
                  description: 'Local number without the dial code.'
                  example: '501234567'
                phone_country_code:
                  type: string
                  description: 'Dial code, required with phone.'
                  example: '+971'
                password:
                  type: string
                  description: 'At least 8 characters.'
                  example: secret123
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: secret123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/auth/verify-otp:
    post:
      summary: 'Verify sign-up code'
      operationId: verifySignUpCode
      description: "Step 2 of sign-up: the 4-digit code emailed by `POST /api/auth/register`. Marks the\nemail verified and returns a Bearer token."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 12|9xQ...
                  token_type: Bearer
                  user:
                    id: 7
                    name: 'Sara Ahmed'
                    email: buyer@example.com
                    phone: null
                    location: null
                    avatar_url: null
                    email_verified: true
                properties:
                  token:
                    type: string
                    example: 12|9xQ...
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7
                      name:
                        type: string
                        example: 'Sara Ahmed'
                      email:
                        type: string
                        example: buyer@example.com
                      phone:
                        type: string
                        example: null
                        nullable: true
                      location:
                        type: string
                        example: null
                        nullable: true
                      avatar_url:
                        type: string
                        example: null
                        nullable: true
                      email_verified:
                        type: boolean
                        example: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid or expired code.'
                properties:
                  message:
                    type: string
                    example: 'Invalid or expired code.'
      tags:
        - 'User Auth'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: 'The `user_id` returned by register.'
                  example: 7
                code:
                  type: string
                  description: 'The emailed code.'
                  example: '1234'
                device_name:
                  type: string
                  description: "A label for this device's token."
                  example: 'Pixel 8'
              required:
                - user_id
                - code
      security: []
  /api/auth/resend-otp:
    post:
      summary: 'Resend sign-up code'

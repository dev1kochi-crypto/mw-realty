openapi: 3.0.3
info:
  title: 'MW Realty — Frontend API'
  description: 'REST API for the MW Realty mobile app: property search, listings, agents, content, customer accounts, enquiries and the AI assistant.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: 'App Config'
    description: ''
  -
    name: Home
    description: ''
  -
    name: 'Search & Filters'
    description: "\nPublic read-only endpoint the frontend (home banner + /properties listing)\nuses to render the search filter bar. Options come straight from the\nadmin-managed filters/filter_values tables, so a new filter or option\nshows up here without a code change. Option counts and slider bounds use\nthe listings of the page asking: residential by default, or `?scope=commercial` for /commercial."
  -
    name: Properties
    description: ''
  -
    name: 'Agents & Agencies'
    description: "\nPublic, read-only endpoints for the /agents listing page and /agent-details/{slug} page."
  -
    name: 'User Auth'
    description: "\nToken (Bearer) auth for the mobile app's **User** account (buyers/visitors). Agents and\nagencies don't sign in through these endpoints.\n\nSame accounts, OTP and Google rules as the website's session login\n(Customer\\CustomerAuthController) — the only difference is that a successful sign-in returns\na Sanctum token instead of a cookie.\n\nSend the token on every authenticated request: `Authorization: Bearer {token}`."
  -
    name: 'User Account'
    description: "\nThe logged-in customer's own dashboard data (Profile.vue / the app's account screens) —\nwishlist, saved searches, enquiries, settings. Served twice: under /customer/* for the\nwebsite's session login and under /api/customer/* for the app's Bearer token; the 'sanctum'\nguard resolves either."
  -
    name: 'Leads & Enquiries'
    description: ''
  -
    name: 'AI Chat'
    description: ''
  -
    name: 'Contact & Newsletter'
    description: ''
  -
    name: Content
    description: ''
  -
    name: Careers
    description: ''
  -
    name: Tracking
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/auth/login</code>, <code>/api/auth/verify-otp</code> or <code>/api/auth/google</code>, and send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/languages:
    get:
      summary: Languages
      operationId: languages
      description: 'The languages content is available in. Send the chosen `code` as `?lang=` on every request.'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'App Config'
      security: []
  /api/currencies:
    get:
      summary: Currencies
      operationId: currencies
      description: "Prices from every endpoint are in AED; to display another currency, multiply by its `rate`\n(units per 1 AED)."
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'App Config'
      security: []
  /api/static-translations:
    get:
      summary: 'UI translations'
      operationId: uITranslations
      description: "Static UI copy (labels, buttons…) as a key → text map for one language. Cache it on the\ndevice per language."
      parameters:
        -
          in: query
          name: lang
          description: 'A code from `GET /api/languages`.'
          example: en
          required: false
          schema:
            type: string
            description: 'A code from `GET /api/languages`.'
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'App Config'
      security: []
  /api/ads:
    get:
      summary: 'Ad banner'
      operationId: adBanner
      description: 'The active ad for a screen, or `false` when there is none (hide the slot).'
      parameters:
        -
          in: query
          name: placement
          description: 'home, property-details, …'
          example: home
          required: false
          schema:
            type: string
            description: 'home, property-details, …'
            example: home
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'App Config'
      security: []
  /api/site-information:
    get:
      summary: 'Site information'
      operationId: siteInformation
      description: 'Office address, phone, email, WhatsApp and social links (the website footer).'
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'App Config'
      security: []
  /api/home:
    get:
      summary: 'Home screen'
      operationId: homeScreen
      description: "Every home section in one request: banner, brands, ad, developments, premium properties,\nluxury, why-choose-us, communities, popular places, testimonials, contact. Property lists\ninside are shuffled on each call."
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - Home
      security: []
  /api/home/new-projects:
    get:
      summary: 'New projects by city'
      operationId: newProjectsByCity
      description: 'The home "Browse New Projects" section''s listings for one city tab.'
      parameters:
        -
          in: query
          name: city
          description: 'A city tab from the home response.'
          example: Dubai
          required: false
          schema:
            type: string
            description: 'A city tab from the home response.'
            example: Dubai
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - Home
      security: []
  /api/property-filters:
    get:
      summary: 'Search filter bar'
      operationId: searchFilterBar
      description: "The filters to render (selects with their options and live listing counts, number sliders\nwith min/max/step), in admin order. Pass the chosen `value`s back to the listing endpoints\nunder each filter's `key`."
      parameters:
        -
          in: query
          name: page
          description: "Which screen's filter set: `home` (compact) or `listing` (full)."
          example: listing
          required: false
          schema:
            type: string
            description: "Which screen's filter set: `home` (compact) or `listing` (full)."
            example: listing
        -
          in: query
          name: scope
          description: 'Whose listings the counts/bounds come from: residential, commercial, premium, marketing.'
          example: residential
          required: false
          schema:
            type: string
            description: 'Whose listings the counts/bounds come from: residential, commercial, premium, marketing.'
            example: residential
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'Search & Filters'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: string
                  description: ''
                  example: home
                  enum:
                    - home
                    - listing
                lang:
                  type: string
                  description: 'Must not be greater than 10 characters.'
                  example: vmqeopfuu
                scope:
                  type: string
                  description: ''
                  example: marketing
                  enum:
                    - residential
                    - commercial
                    - premium
                    - marketing
      security: []
  /api/location-suggestions:
    get:
      summary: 'Location autocomplete'
      operationId: locationAutocomplete
      description: "Cities, communities and addresses matching what the user typed (2+ characters; fewer\nreturns an empty list). Pass a picked suggestion back as `city=` / `community=` /\n`location=` on the listing endpoints. Debounce on the client — limited to 120 calls/minute."
      parameters:
        -
          in: query
          name: q
          description: 'The typed text.'
          example: mar
          required: false
          schema:
            type: string
            description: 'The typed text.'
            example: mar
        -
          in: query
          name: scope
          description: 'all (default) or commercial.'
          example: all
          required: false
          schema:
            type: string
            description: 'all (default) or commercial.'
            example: all
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - 'Search & Filters'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: vmqeopfuudtdsufvyvddq
                  nullable: true
                lang:
                  type: string
                  description: 'Must not be greater than 10 characters.'
                  example: amniihfqc
                  nullable: true
                scope:
                  type: string
                  description: ''
                  example: commercial
                  enum:
                    - all
                    - commercial
                  nullable: true
      security: []
  /api/commercial:
    get:
      summary: 'Search commercial properties'
      operationId: searchCommercialProperties
      description: 'Commercial listings (16 per page) — same response shape as `GET /api/properties`.'
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: query
          name: page
          description: ''
          example: 1
          required: false
          schema:
            type: integer
            description: ''
            example: 1
        -
          in: query
          name: search
          description: 'Title, community or reference number.'
          example: null
          required: false
          schema:
            type: string
            description: 'Title, community or reference number.'
            example: null
        -
          in: query
          name: category
          description: 'Purpose: sale, rent or off_plan. e.g. `rent`.'
          example: null
          required: false
          schema:
            type: string
            description: 'Purpose: sale, rent or off_plan. e.g. `rent`.'
            example: null
        -
          in: query
          name: property_type
          description: 'e.g. `office`.'
          example: null
          required: false
          schema:
            type: string
            description: 'e.g. `office`.'
            example: null
        -
          in: query
          name: location
          description: ''
          example: null
          required: false
          schema:
            type: string
            description: ''
            example: null
        -
          in: query
          name: city
          description: ''
          example: null
          required: false
          schema:
            type: string
            description: ''
            example: null
        -
          in: query
          name: community
          description: ''
          example: null
          required: false
          schema:
            type: string
            description: ''
            example: null
        -
          in: query
          name: completion_status
          description: 'ready or off_plan.'
          example: null
          required: false
          schema:
            type: string
            description: 'ready or off_plan.'
            example: null
        -
          in: query
          name: min_price
          description: ''
          example: null
          required: false
          schema:
            type: number
            description: ''
            example: null
        -
          in: query
          name: max_price
          description: ''
          example: null
          required: false
          schema:
            type: number
            description: ''
            example: null
        -
          in: query
          name: min_sqft
          description: ''
          example: null
          required: false
          schema:
            type: number
            description: ''
            example: null
        -
          in: query
          name: max_sqft
          description: ''
          example: null
          required: false
          schema:
            type: number
            description: ''
            example: null
        -
          in: query
          name: bathrooms
          description: '1, 2, 3, 4 or 5+.'
          example: null
          required: false
          schema:
            type: string
            description: '1, 2, 3, 4 or 5+.'
            example: null
        -
          in: query
          name: amenities
          description: ''
          example: null
          required: false
          schema:
            type: array
            description: ''
            example: null
            items:
              type: string
        -
          in: query
          name: sort
          description: 'recent, price_asc, price_desc or popular.'
          example: null
          required: false
          schema:
            type: string
            description: 'recent, price_asc, price_desc or popular.'
            example: null
        -
          in: header
          name: X-Device-Id
          description: ''
          example: '{DEVICE_ID}'
          schema:
            type: string
      responses: {  }
      tags:
        - Properties
      security: []
  /api/properties:
    get:
      summary: 'Search properties'
      operationId: searchProperties
      description: "Residential listings (16 per page) with the result count, pagination and the card data for\neach listing. Filter keys and values come from `GET /api/property-filters`; any admin\nselect filter whose key is a property column also works as `?{key}=value`."
      parameters:
        -
          in: query
          name: lang
          description: ''
          example: en
          required: false
          schema:
            type: string
            description: ''
            example: en
        -
          in: query
          name: page
          description: ''
          example: 1
          required: false
          schema:
            type: integer
            description: ''
            example: 1
        -
          in: query
          name: listing_type
          description: 'Purpose: sale, rent or off_plan. e.g. `sale`.'
          example: null
          required: false
          schema:
            type: string
            description: 'Purpose: sale, rent or off_plan. e.g. `sale`.'
            example: null
        -
          in: query
          name: property_type
          description: 'e.g. `apartment`.'
          example: null
          required: false
          schema:
            type: string
            description: 'e.g. `apartment`.'
            example: null
        -
          in: query
          name: location
          description: 'Free-text location. e.g. `Dubai Marina`.'
          example: null
          required: false
          schema:
            type: string
            description: 'Free-text location. e.g. `Dubai Marina`.'
            example: null
        -
          in: query
          name: city
          description: 'Exact city from a location suggestion. e.g. `Dubai`.'
          example: null
          required: false
          schema:
            type: string
            description: 'Exact city from a location suggestion. e.g. `Dubai`.'
            example: null
        -
          in: query
          name: community
          description: 'Exact community from a location suggestion. e.g. `Dubai Marina`.'
          example: null
          required: false
          schema:
            type: string
            description: 'Exact community from a location suggestion. e.g. `Dubai Marina`.'
            example: null
        -
          in: query
          name: bedrooms
          description: 'e.g. `2`.'
          example: null
          required: false
          schema:
            type: string
            description: 'e.g. `2`.'
            example: null
        -
          in: query
          name: bathrooms
          description: 'e.g. `2`.'
          example: null
          required: false
          schema:
            type: string
            description: 'e.g. `2`.'
            example: null
        -
          in: query
          name: completion_status
          description: 'ready or off_plan. e.g. `ready`.'
          example: null
          required: false
          schema:
            type: string
            description: 'ready or off_plan. e.g. `ready`.'
            example: null
        -
          in: query
          name: min_price
          description: 'AED. e.g. `1000000`.'
          example: null
          required: false
          schema:
            type: number
            description: 'AED. e.g. `1000000`.'
            example: null
        -
          in: query
          name: max_price
          description: 'AED. e.g. `3000000`.'
          example: null
          required: false
          schema:
            type: number
            description: 'AED. e.g. `3000000`.'
            example: null
        -
          in: query
          name: min_sqft
          description: 'e.g. `800`.'
          example: null
          required: false
          schema:
            type: number
            description: 'e.g. `800`.'
            example: null
        -
          in: query
          name: max_sqft
          description: 'e.g. `2000`.'
          example: null
          required: false
          schema:
            type: number
            description: 'e.g. `2000`.'
            example: null
        -
          in: query
          name: amenities
          description: 'Amenity values from the filters endpoint.'
          example: null
          required: false
          schema:
            type: array
            description: 'Amenity values from the filters endpoint.'
            example: null
            items:
              type: string
        -
          in: query
          name: sort
          description: 'recent, price_asc, price_desc or popular. e.g. `recent`.'
          example: null
          required: false
          schema:
            type: string
            description: 'recent, price_asc, price_desc or popular. e.g. `recent`.'
            example: null
        -
          in: query
          name: premium
          description: '1 = featured (premium) listings only, residential + commercial. e.g. `0`.'
          example: null
          required: false
          schema:
            type: boolean
            description: '1 = featured (premium) listings only, residential + commercial. e.g. `0`.'
            example: null
        -
          in: query
          name: marketing
          description: '1 = Marketing Properties only. e.g. `0`.'
          example: null
          required: false
          schema:
            type: boolean
            description: '1 = Marketing Properties only. e.g. `0`.'
            example: null
        -
          in: query
          name: agent
          description: "An agent's slug — only their listings."
          example: null
          required: false

                  example: 7
              required:
                - user_id
      security: []
  /api/auth/login:
    post:
      summary: 'Sign in'
      operationId: signIn
      description: 'Email + password sign-in. Returns a Bearer token for the `Authorization` header.'
      parameters:
        -
          in: header
          name: X-Device-Id
          description: ''

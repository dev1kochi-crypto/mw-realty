<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MW Realty — CRM API</title>
</head>
<body>
    <!-- Reads the OpenAPI spec Scribe generates (php artisan docs:generate); no pre-rendered HTML. -->
    <script id="api-reference" data-url="../_scribe/crm/openapi.yaml"></script>
    <script>
        // Resolve the spec from this folder whether or not the URL ends in "/" (php artisan serve does not add it).
        document.getElementById('api-reference').dataset.url = location.pathname.replace(/\/(index\.html)?$/, '') + '/' + '../_scribe/crm/openapi.yaml';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>

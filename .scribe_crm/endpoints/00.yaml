name: 'CRM Auth'
description: |-

  Token (Bearer) sign-in for the CRM mobile app — **agents and agencies** only.

  Same accounts and the same checks as the website's portal login (Portal\PortalAuthController):
  password, then — when the account has two-factor on — an emailed code for a device it hasn't
  signed in from before, then the authenticator-app code. The steps are linked by the
  `challenge_token` returned by each step instead of a session.

  Keep the `device_token` returned on success and send it with the next login, so a known
  device skips the emailed code. Send the `token` on every other request:
  `Authorization: Bearer {token}`.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/crm/auth/login
    metadata:
      custom: []
      groupName: 'CRM Auth'
      groupDescription: |-

        Token (Bearer) sign-in for the CRM mobile app — **agents and agencies** only.

        Same accounts and the same checks as the website's portal login (Portal\PortalAuthController):
        password, then — when the account has two-factor on — an emailed code for a device it hasn't
        signed in from before, then the authenticator-app code. The steps are linked by the
        `challenge_token` returned by each step instead of a session.

        Keep the `device_token` returned on success and send it with the next login, so a known
        device skips the emailed code. Send the `token` on every other request:
        `Authorization: Bearer {token}`.
      subgroup: ''
      subgroupDescription: ''
      title: 'Sign in'
      description: |-
        Either signs in straight away (`token` in the response), or asks for the next step:
        `challenge: "email"` → `POST /api/crm/auth/login/verify-email`,
        `challenge: "totp"` → `POST /api/crm/auth/login/two-factor`, passing the `challenge_token`.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      X-Device-Id: '{DEVICE_ID}'
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: ''
        required: true
        example: agent@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: ''
        required: true
        example: secret123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      device_name:
        custom: []
        name: device_name
        description: "Shown in the account's signed-in devices."
        required: false
        example: "Sara's iPhone"
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      device_token:
        custom: []
        name: device_token
        description: "The `device_token` from this device's last sign-in."
        required: false
        example: 9fK2…
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      email: agent@example.com
      password: secret123
      device_name: "Sara's iPhone"
      device_token: 9fK2…
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"token": "1|abc…", "token_type": "Bearer", "device_token": "9fK2…", "user": {"id": 12, "type": "agent", "name": "Sara Ahmed"}}'
        headers: []
        description: 'Signed in'
      -
        custom: []
        status: 200
        content: '{"challenge": "email", "email": "sa••••@example.com", "challenge_token": "Xc3…"}'
        headers: []
        description: 'New device'
      -
        custom: []
        status: 200
        content: '{"challenge": "totp", "challenge_token": "Xc3…"}'
        headers: []
        description: 'Two-factor on'
      -
        custom: []
        status: 422
        content: '{"message": "Invalid credentials."}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null

        description: 'residential | commercial.'
        required: false
        example: residential
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      q:
        custom: []
        name: q
        description: 'Title, ref no, RERA, address, community or city (and agent / agency for Super Admin).'

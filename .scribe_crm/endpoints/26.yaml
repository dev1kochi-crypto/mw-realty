name: 'CRM Master — Property Options'
description: |-

  Super Admin only: the option lists behind the property form's Property Type, Listing Type,
  Completion Status and Furnishing dropdowns, plus the Nearby Places "Type" dropdown — the same
  Filter / FilterValue records the website filters use. Agents / agencies ask for new options via a ticket.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/crm/master/property-options
    metadata:
      custom: []
      groupName: 'CRM Master — Property Options'
      groupDescription: |-

        Super Admin only: the option lists behind the property form's Property Type, Listing Type,
        Completion Status and Furnishing dropdowns, plus the Nearby Places "Type" dropdown — the same
        Filter / FilterValue records the website filters use. Agents / agencies ask for new options via a ticket.
      subgroup: ''
      subgroupDescription: ''
      title: 'One option list'
      description: |-
        The left menu (every list with its count, grouped), the chosen list's options in form order
        with how many listings (or nearby places) use each, and the active languages (default first).
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      X-Device-Id: '{DEVICE_ID}'
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      list:
        custom: []
        name: list
        description: 'One of the list keys.'
        required: false
        example: property_type
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
      list: property_type
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null

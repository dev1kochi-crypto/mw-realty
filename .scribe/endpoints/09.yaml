      device_name: 'Pixel 8'
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"token": "12|9xQ...", "token_type": "Bearer", "user": {"id": 7, "name": "Sara Ahmed", "email": "buyer@example.com", "phone": null, "location": null, "avatar_url": null, "email_verified": true}}'
        headers: []
        description: ''

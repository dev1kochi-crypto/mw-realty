name: 'User Auth'
description: |-

  Token (Bearer) auth for the mobile app's **User** account (buyers/visitors). Agents and
  agencies don't sign in through these endpoints.

  Same accounts, OTP and Google rules as the website's session login
  (Customer\CustomerAuthController) — the only difference is that a successful sign-in returns
  a Sanctum token instead of a cookie.

  Send the token on every authenticated request: `Authorization: Bearer {token}`.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/auth/register
    metadata:
      custom: []
      groupName: 'User Auth'
      groupDescription: |-

        Token (Bearer) auth for the mobile app's **User** account (buyers/visitors). Agents and
        agencies don't sign in through these endpoints.

        Same accounts, OTP and Google rules as the website's session login
        (Customer\CustomerAuthController) — the only difference is that a successful sign-in returns
        a Sanctum token instead of a cookie.

        Send the token on every authenticated request: `Authorization: Bearer {token}`.
      subgroup: ''
      subgroupDescription: ''
      title: 'Sign up'
      description: |-
        Step 1 of sign-up. Creates the account and emails a 4-digit code — no token yet; call
        `POST /api/auth/verify-otp` with the returned `user_id` and the code.
        `email_sent: false` means the email failed — offer "Resend code".
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      X-Device-Id: '{DEVICE_ID}'
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      name:
        custom: []
        name: name
        description: ''
        required: true
        example: 'Sara Ahmed'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      email:
        custom: []
        name: email
        description: 'Must not already be registered.'
        required: true
        example: buyer@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      phone:
        custom: []
        name: phone
        description: 'Local number without the dial code.'
        required: false
        example: '501234567'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      phone_country_code:
        custom: []
        name: phone_country_code
        description: 'Dial code, required with phone.'
        required: false
        example: '+971'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'At least 8 characters.'
        required: true
        example: secret123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password_confirmation:
        custom: []
        name: password_confirmation
        description: 'Must match password.'
        required: true
        example: secret123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      name: 'Sara Ahmed'
      email: buyer@example.com
      phone: '501234567'
      phone_country_code: '+971'
      password: secret123
      password_confirmation: secret123
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"otp_required": true, "user_id": 7, "email_sent": true}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"message": "The email has already been taken.", "errors": {"email": ["The email has already been taken."]}}'
        headers: []
        description: 'Validation error'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
